# AILoveShen Default Configuration
# Environment-specific values should be in development.yaml or production.yaml

app_name: AILoveShen
debug: false

# The stream (python -m ailoveshen.stream, docs/streaming.md)
stream:
  board_port: 8765         # goal board, avatar and debug pages for OBS; 0: off
  speak: true              # read the commentary and replies aloud (the TTS server must be up)
  # Narration at small-goal boundaries (docs/design/34 §6): jev = Jev says whether it is worth
  # speaking now (highlights and max_silence_seconds of quiet always speak; skipped events are
  # kept for the next line); always = every boundary
  commentary_judge: "jev"
  max_silence_seconds: 180
  commentary_record_dir: "logs/commentary"
  # Every spoken line with the state at that moment, and what the TTS did with it (docs/design/65 §2). "": off
  spoken_record_dir: "logs/spoken"
  # Before a narration line or a live line is read, Jev checks it against the state now (in / out of the
  # home, the small goal done or not, the plan) and a mismatch is written again once, then dropped
  # (docs/design/65 §4): jev | off
  speech_check: "jev"
  # The admin page (docs/design/54_admin_panel.md, http://127.0.0.1:<board_port>/admin): saved lines to speak
  presets_path: "data/presets.json"
  # A line in the middle of an action (docs/design/43): after this many seconds of quiet (from the
  # end of the last spoken line) say the tool's new intent, or a new line (purpose live, not kept in
  # the conversation). Lines like the last few are never spoken. 0: off. Only when something changed
  # since the last line (items, position, health, time of day, in / out of the home), and never
  # while the small goal keeps failing (2026-09-29: fewer lines; think and try another way instead)
  live_interval_seconds: 30
  # Nothing changed and this many seconds of quiet (waiting out the night in a hole, a long walk):
  # a line of small talk about how things are now (purpose live), nothing new promised. 0: off
  live_idle_seconds: 60
  # While the next move or goal is being decided, or the small goal keeps failing, and this many seconds
  # of quiet: a line of thinking aloud about the state (nothing started, nothing promised). 0: off
  live_thinking_seconds: 40

# Twitch Integration
twitch:
  enabled: true
  channel: "${TWITCH_CHANNEL:-}"
  client_id: "${TWITCH_CLIENT_ID:-}"
  client_secret: "${TWITCH_CLIENT_SECRET:-}"
  # Posting to chat (the !commands list): a user access token with chat:edit and its account's login
  # (empty login: the channel's own account). Without a token the chat is only read; the list is spoken
  access_token: "${TWITCH_ACCESS_TOKEN:-}"
  bot_login: "${TWITCH_BOT_LOGIN:-}"
  # Follow alerts (EventSub, docs/design/71_support_thanks.md): with client_id set (a public application
  # needs no client secret) the token is obtained and refreshed automatically: on the first start the log
  # shows a URL and a code that the broadcaster opens in a browser and approves (device code flow), then
  # the token is kept in token_path (a refresh token lasts 30 days unused; the access token 4 hours).
  # eventsub_token: a token made by hand (scope moderator:read:followers, same client id, of the
  # broadcaster or a moderator) is used as it is and cannot be refreshed: leave it empty
  eventsub_token: "${TWITCH_EVENTSUB_TOKEN:-}"
  token_path: "data/twitch_token.json"
  # When an approval is needed, open the approval page in this PC's browser (the default browser: it must
  # be logged in as the broadcaster) and say so aloud, once per approval; the URL is always in the log
  open_browser: true

  # Thanking viewers who support the stream: subs, gift subs, raids and bits arrive over the chat
  # connection (no token needed); follows over EventSub (client_id + the token above). The streamer
  # says thanks (fixed lines, no LLM wait) and the avatar cheers or waves
  support:
    enabled: true
    follows: true
    min_interval_seconds: 3.0   # between two thanks
    batch_seconds: 2.0          # follows arriving together are thanked in one line
    backlog: 20                 # thanks waiting; older ones are dropped
    dedupe_seconds: 3600        # the same follower is not thanked again within this
  # The channel's own account and bot_login get no reply (their !commands still work).
  # Bots (logins) get nothing at all, not even commands. Add others such as nightbot here
  ignore_users: [streamelements]

  # Replies to chat (python -m ailoveshen.stream). The chat is read anonymously: only the channel
  # is needed (TWITCH_CHANNEL), no token.
  response:
    min_interval_seconds: 5.0
    backlog: 3             # comments kept while a reply is being made (the newest ones)
    # Before a reply (docs/design/34 §5): jev = Jev sorts each comment (reply or not, and its kind);
    # requests, advice and withdrawals always get a reply (Gemini); only chat / noise that Jev says
    # needs no reply (both answers >= skip_min_confidence) is skipped; withdrawals and requests go
    # first. off = reply to every comment in order
    triage: "jev"
    skip_min_confidence: 0.7
    triage_record_dir: "logs/chat"   # every comment's triage, skipped ones with their text
    # After a reply that neither accepts a request nor writes a rethink (docs/design/34 §10): jev = Jev
    # says whether the reply promises to do something in the game; if so Gemini (purpose promise)
    # turns the promise into an objective, now (cutting the small goal) or after the current one, or
    # the reply is written again without the promise. Unsure or failing Jev: spoken as is.
    # off = no check
    promise_check: "jev"
    promise_record_dir: "logs/promises"   # every check with the comment and the reply
    # After a reply is written: jev = Jev says whether it flatly denies having something that the
    # bridge shows she carries or has in her chests ("no iron found" with iron in the chest); if so the
    # reply is written again once, with the facts. Unsure or failing Jev: spoken as is. off = no check
    fact_check: "jev"
    fact_record_dir: "logs/facts"   # every check with the reply and what she holds

  # How viewers' names are read aloud (docs/design/30_name_readings.md): learned from `!yomi <reading>` / `!yomi <word> <reading>`
  # and from replies; used only for the text sent to TTS. Lookup: GET /api/readings on the board
  readings_path: "data/readings.json"
  # What the streamer said about herself in chat (docs/design/40_small_talk.md): remembered from replies
  # and shown to every reply so she never says otherwise; kept across world resets
  self_facts_path: "data/self_facts.json"

  # Reconnection settings
  reconnect:
    enabled: true
    base_delay_seconds: 1.0
    max_delay_seconds: 300.0
    exponential_base: 2.0
    # Server errors: infinite retry with backoff
    # Client errors: no retry

# Comment Filter (Gemini Flash)
comment_filter:
  enabled: true
  # Dynamic threshold based on comment volume
  base_threshold: 0.5
  min_threshold: 0.3
  max_threshold: 0.9
  # Volume measurement window
  window_seconds: 60
  # Messages per minute thresholds
  low_volume_mpm: 5.0
  high_volume_mpm: 30.0
  # Filter results logging
  log_results: true

# LLM (docs/design/36, 127). Local LLM: an OpenAI-compatible server (FreeToken :1919, Ollama :11434/v1,
# llama.cpp, vLLM) answers the text calls; calls with images always go to the remote LLM (the local model
# runs without vision), and so does a call too long for context_tokens. Off by default: LOCAL_LLM=1.
# The remote LLM is whatever LiteLLM serves (llm.litellm below; Claude, Gemini, ...): there is no direct
# call to a cloud API, so no API key besides LITELLM_API_KEY. It does everything when the local LLM is off.
llm:
  local:
    enabled: "${LOCAL_LLM:-false}"
    base_url: "${LOCAL_LLM_URL:-http://127.0.0.1:1919/v1}"
    model: "${LOCAL_LLM_MODEL:-}"        # empty: the first of /v1/models
    api_key: "${LOCAL_LLM_API_KEY:-}"
    context_tokens: 130000               # per request (the server's max sequence length)
    max_output_tokens: 16384             # thinking included; cut to what the context leaves per call
    # auto: also send response_format json_schema (dropped for good if the server refuses it);
    # the schema is always written in the prompt and the answer checked against it
    response_format: "auto"
    # chat_template_kwargs: {"enable_thinking": ...} per call (thinking for gemini.thinking_levels
    # medium / high); none: leave it to the server
    thinking_param: "chat_template_kwargs"
    # Purposes the local model thinks for (all others: no thinking). Thinking is slow locally, so the
    # everyday calls (tool_after_failure, commentary, live, reply) do not think; the goal decisions do
    # (they are few and plan the next minutes; user 2026-09-27), and so does the tool choice (user
    # 2026-09-28); town_plan draws the town's master plan (docs/design/47 §9), facility_design lays out
    # a farm or tree farm (47 §7); [] = never think. plan (an objective's jobs and small goals, 50 §18) does
    # not think locally: measured 2026-09-30, the thinking hit a 6000-token cap after 85 s and the answer
    # came from the second call without it (142 s in all; the answer without thinking was usable)
    thinking_purposes: ["goal", "goal_after_failure", "skill_write", "house", "town", "site", "tool", "town_plan", "facility_design"]
    # Output cap (thinking included) per purpose that thinks; when the cap is hit without an answer the
    # call is asked again without thinking (a long think of tool_stuck held the play for minutes;
    # tool_stuck no longer thinks: see config/development.yaml)
    thinking_max_tokens: {tool_stuck: 16000}
    # Output cap per purpose that does not think: a call that keeps writing is cut here (2026-09-30: 4 of
    # 22 replies wrote 2,125-4,462 tokens, 248 s in all, and 12 of 552 tool choices wrote 600-2,498;
    # the usual answer is 90 for a tool, 217 for a reply, 250-350 for a goal, 1,000 for a plan; the caps
    # are above the 99th percentile of 2026-09-29/30)
    output_max_tokens: {tool: 800, tool_after_failure: 800, tool_stuck: 1200, goal: 1600, goal_after_failure: 1600, reply: 1200, commentary: 300, live: 200, plan: 3500, promise: 600}
    max_concurrent: 2
    timeout_seconds: 180
  # The remote LLM: an OpenAI-compatible LiteLLM proxy. Images are sent as data URLs. What differs per
  # model is decided by the model name: a name starting with "claude" gets Claude's thinking setting
  # (the purposes whose thinking_levels below is medium / high send thinking: adaptive + reasoning_effort,
  # the others thinking: disabled: Haiku 5.5 thinks by default, 160-300 tokens a call) and the prompt
  # cache (cache_control on the system message and in front of every CACHE_BREAK the prompt builders put
  # between the part that stays the same and the part that changes). Other models (gemini-3.8-flash) cannot
  # switch thinking off: they get thinking_levels as reasoning_effort (low / medium / high) and no cache_control.
  litellm:
    base_url: "${LITELLM_URL:-https://llm.ideta.net/v1}"
    model: "${LITELLM_MODEL:-}"          # required: the name LiteLLM serves (claude-haiku-5-5, gemini-3.8-flash, ...)
    api_key: "${LITELLM_API_KEY:-}"      # the proxy's master key (pass: LITE_LLM_MASTER_KEY)
    context_tokens: 200000
    max_output_tokens: 8192
    response_format: "auto"
    # Per purpose model (empty: the model above). The purposes that write code go to a stronger model, e.g.
    # LITELLM_CODE_MODEL=claude-sonnet-5-5. Applies only to calls that reach LiteLLM: a purpose that
    # llm.routes sends to local stays on the local model (route it to remote to use this model).
    # These must think (their thinking_levels below is medium / high)
    models:
      skill_write: "${LITELLM_CODE_MODEL:-}"
      check_write: "${LITELLM_CODE_MODEL:-}"
      # The advisor the playing LLM asks when unsure (the ask_advisor tool, docs/design/143), e.g.
      # LITELLM_ADVISOR_MODEL=claude-sonnet-5-5. Empty: ask_advisor is not offered
      advice: "${LITELLM_ADVISOR_MODEL:-}"
    max_concurrent: 4
    timeout_seconds: 120
  # purpose -> local | remote (default: purposes not listed). Images always go to the remote LLM.
  # 2026-09-27: everything but images goes local (the local server has a 130k context); the remote LLM is
  # used only for calls with a screenshot (and a prompt too long even for the local context).
  # Before that (755215d) goal / reply / promise / planning stayed on Gemini because the local model
  # broke their schemas more often; the local adapter asks once again with the errors (docs/design/36 §7–8)
  # The code-writing purposes (skill_write, check_write) have their own switch: CODE_LLM=remote sends only
  # them to the LiteLLM model (LITELLM_CODE_MODEL=claude-sonnet-5-5 makes it Sonnet) while everything else
  # stays local (docs/design/135)
  routes:
    default: "local"
    skill_write: "${CODE_LLM:-local}"
    check_write: "${CODE_LLM:-local}"
    advice: "remote"                     # always the LiteLLM model: the point is a stronger one than the local LLM
    reading: "remote"                    # foreign words to katakana for the voice (docs/design/152): a small local model is poor at Chinese / Korean
  fallback: "none"                       # none | remote: when the local model fails

  default_thinking_level: "low"
  # Every call (the whole prompt, the output, tool calls, tokens, which model answered) is also appended
  # to <generation_log_dir>/gen-<start>.jsonl; files older than generation_log_keep_days are deleted at
  # start. Viewer comments are in the prompts; logs/ is not committed. "" = memory only
  generation_log_dir: "logs/generations"
  generation_log_keep_days: 3
  # How many recent calls GET /api/debug/gemini and /debug/gemini on the goal board (--board-port) keep
  # when the log is memory only
  debug_log_size: 50
  # Thinking depth per purpose (docs/design/19 §7, 21 §7). Only medium / high purposes think (local:
  # llm.local.thinking_purposes, LiteLLM Claude: thinking: adaptive + reasoning_effort). Purposes not
  # listed use default_thinking_level. high is unmeasured (it may hit max_output_tokens): measure before relying on it.
  thinking_levels:
    town: "high"               # the town definition
    site: "high"               # choosing the town site
    town_plan: "high"          # the town's master plan (docs/design/47 §6)
    facility_design: "high"    # a farm or tree farm's zones and size (docs/design/47 §7)
    plan: "high"               # an objective's jobs and their small goals with prerequisites (docs/design/50 §18)
    house: "medium"            # designing the house
    build_design: "high"       # designing a named build (docs/design/25_builds.md)
    goal: "low"                # the small goal (with objective edits and notes)
    goal_after_failure: "medium"
    tool: "low"                # one tool call (control: tools)
    tool_after_failure: "medium"
    tool_stuck: "medium"       # the tool choice while the small goal keeps failing: think, then try another way
    commentary: "low"
    reply: "low"               # a viewer is waiting
    live: "low"                # a line in the middle of an action (docs/design/43)
    promise: "low"             # how to keep a promise a reply made (docs/design/34 §10)
    screen_review: "medium"    # comparing the stream screen with the goal (docs/design/23)
    skill_write: "high"        # writing or fixing a skill (docs/design/22)
    check_write: "medium"      # writing the check of a custom(name) condition (docs/design/42)
    advice: "medium"           # the advisor's answer to the playing LLM (docs/design/143)
    lesson_compaction: "low"   # merging similar lessons when the lesson book is full (docs/design/144)

character:
  name: "AILoveShen"
  description: |
    明るく元気なAI配信者。
    Minecraftが大好きで、建築よりも冒険派。
    視聴者との交流を楽しんでいる。
  speech_style: |
    フレンドリーで親しみやすい話し方。
    時々ゲームに熱中して独り言が多くなる。
  first_person: "私"
  sentence_endings:
    - "だよ"
    - "だね"
    - "かな"
    - "！"
  personality_traits:
    - "好奇心旺盛"
    - "ポジティブ"
    - "ちょっとおっちょこちょい"
    - "視聴者思い"

# TTS (Style-Bert-VITS2)
tts:
  enabled: true
  # Which engine speaks: style_bert_vits2 (Docker, tts.server) / irodori (Irodori-TTS-Server,
  # tts.irodori; run it natively on the Mac, not in Docker: docs/setup/irodori_tts.md)
  engine: "${TTS_ENGINE:-style_bert_vits2}"
  # Who picks the emotion of each spoken line (docs/design/34 §4): jev = Jev picks it together with
  # the avatar's expression before the line is spoken (Style-Bert-VITS2 style via
  # emotion_style_map, Irodori-TTS emotion voices/captions); off = always neutral
  emotion_judge: "jev"

  # Server connection settings
  server:
    host: "localhost"
    port: 5001
    timeout_seconds: 30

  # Voice settings
  voice:
    model_name: "${TTS_MODEL_NAME:-shen}"  # Directory name under Style-Bert-VITS2/model_assets
    speaker_id: 0
    language: "JP"
    default_style: "Neutral"

  # Synthesis parameters
  synthesis:
    sdp_ratio: 0.2
    noise: 0.6
    noisew: 0.8
    length: 1.0
    style_weight: null  # strength of the style (emotion); null: the server's default (1.0)

  # Queue settings
  queue:
    max_size: 10
    # source -> seconds a line may wait in the queue; older ones are dropped unread (the play has
    # moved on). Commentary only: replies to viewers are read even when late
    max_age_seconds:
      commentary: 20

  # Audio output settings
  audio:
    # device: null = default device
    # Windows (VB-Audio Cable): "CABLE Input (VB-Audio Virtual Cable)"
    # macOS (BlackHole): "BlackHole 2ch"
    device: null
    blocksize: 1024
    # Raise the voice by this many dB before playing (0: as the server returns it). The server
    # returns every line at full scale (0 dBFS peak), so the peaks above 1.0 are rounded by a soft
    # limiter (measured on the shen_clean voice: +3 dB = +2.9 LUFS with 2% of the samples rounded,
    # +6 dB = +5.4 LUFS with 6%, +9 dB = +7.5 LUFS with 13%)
    gain_db: 0.0

  # Emotion to Style mapping (for EmotionStyleService)
  # Styles of the shen model: Neutral (from Irodori-TTS's plain reading), Happy / Surprised / Sad /
  # Angry / Fear (tools/sbv2_add_styles.py), Neutral-01 (the Neutral from the original recordings).
  # Unknown styles return 422.
  emotion_style_map:
    neutral: "Neutral"
    happy: "Neutral"
    sad: "Neutral"
    angry: "Neutral"
    surprised: "Neutral"
    scared: "Neutral"
    excited: "Neutral"

  # Irodori-TTS (engine: irodori). The voice is cloned from reference audio in the server's
  # voices/ (tools/irodori_voice.py makes it from the Style-Bert-VITS2 training clips), no training.
  irodori:
    host: "${IRODORI_HOST:-localhost}"
    port: 8088
    timeout_seconds: 60        # the first call also loads the model
    voice: "${IRODORI_VOICE:-shen}"
    speed: 1.0
    num_steps: null            # null: the model's default (fewer: faster, rougher)
    seed: 1234                 # fixed: the same line always sounds the same (null: varies)
    cfg_scale_text: null
    cfg_scale_speaker: null    # higher: closer to the reference voice
    # LoRA trained with tools/irodori_from_sbv2.py train (a folder on the server's machine; empty: none)
    lora_adapter: "${IRODORI_LORA:-}"
    # A voice per emotion (reference clips spoken in that emotion, made by
    # tools/irodori_from_sbv2.py emotions), used at intensity >= caption_min_intensity; other
    # emotions and weak ones use `voice`. Example: {happy: shen_sbv2_happy, sad: shen_sbv2_sad}
    emotion_voices: {}
    # Emotions as a speaking-style caption (only at intensity >= caption_min_intensity).
    # Off by default: a caption can pull the voice away from the reference; try it with
    # tools/tts_compare.py --emotion first.
    emotion: false
    caption_min_intensity: 0.6
    emotion_captions:
      happy: "明るく楽しそうな話し方。"
      excited: "テンションが高く、弾むような話し方。"
      sad: "しょんぼりした、少し沈んだ話し方。"
      angry: "むっとした、少し強い口調。"
      surprised: "驚いた、声が少し上ずった話し方。"
      scared: "怖がって、少し震えた話し方。"

# MCP Settings
mcp:
  enabled: true

  memory:
    short_term_capacity: 20
    long_term_db: "data/memory.db"
    # Auto-save memories with importance >= HIGH
    auto_save_min_importance: "high"

  emotion:
    default_state: "neutral"
    decay_rate: 0.1
    neutral_threshold: 0.3
    # Decay is applied when generating commentary

# Live2D (VTube Studio) Integration
live2d:
  enabled: true

  vtube_studio:
    host: "localhost"
    port: 8001
    timeout_seconds: 10

  plugin:
    name: "AILoveShen"
    developer: "AILoveShen"

  auth:
    token_file: "data/.vts_token.json"

  # Emotion to Expression mapping
  emotion_expression_map:
    neutral: "neutral.exp3.json"
    happy: "happy.exp3.json"
    sad: "sad.exp3.json"
    angry: "angry.exp3.json"
    surprised: "surprised.exp3.json"
    scared: "scared.exp3.json"
    excited: "excited.exp3.json"

  sync:
    auto_sync_emotions: true
    intensity_threshold: 0.3
    default_expression: "neutral.exp3.json"

# The streamer's avatar (docs/design/24_avatar.md): a VRM shown at /avatar on the goal board
# (--board-port), an OBS browser source with a transparent background
avatar:
  model_path: "models/vrm/ailoveshen.vrm"
  # Where the mouth movement comes from: auto (the TTS playback events when they come, otherwise
  # the generated text with an estimated length) / text / tts
  lip_sync: "auto"
  # Who picks the expression and gesture: jev (Jev reads the situation and the line; the rules
  # below it are the fallback on failure, timeout or low confidence) / rules (rules only)
  judge: "jev"
  judge_timeout_seconds: 1.5
  record_dir: "logs/avatar"   # Jev's and the rules' answers side by side (empty: none)

# OBS WebSocket (OBS 28+ / WebSocket 5.x)
obs:
  enabled: true
  host: "localhost"
  port: 4455
  password: "${OBS_PASSWORD:-}"
  # Gemini sees the stream screen (docs/design/23): the name of the OBS source that shows the
  # game (the POV client on 127.0.0.1:25578). Never the whole scene (the goal board would show).
  # Empty: no screenshots. Without OBS the play goes on text only.
  game_source: "${OBS_GAME_SOURCE:-Minecraft}"
  screenshot_width: 768
  screenshot_quality: 70
  timeout_seconds: 3
  retry_seconds: 60        # after a failed capture, no capture for this long

  # Scene name mapping (configure actual names in OBS)
  scenes:
    main: "Main Scene"
    starting: "Starting Soon"
    ending: "Ending"
    brb: "Be Right Back"

  # Subtitle settings (font/position configured in OBS)
  subtitle:
    source_name: "Subtitles"
    # Default: persistent display (null = no auto-hide)
    default_duration_seconds: null

# Game Integration (Abstract layer for multiple games)
game:
  enabled: false

  # Current game adapter
  adapter: "minecraft"  # Future: "terraria", "factorio", etc.

  # Action execution
  action_timeout_seconds: 5
  enable_parallel_actions: true
  action_queue_size: 10

  # State polling
  polling_interval_ms: 100

  # Event detection
  events:
    health_change_threshold: 5

# Jev (TypeSafe AI System One): picks the next action within the LLM's goal
jev:
  api_key: "${TYPESAFE_API_KEY:-}"
  model: "jev-latest"
  timeout_seconds: 10

# Minecraft (Mineflayer bridge sidecar: minecraft-bridge/)
# Server connection and bot name are the bridge's env vars (MC_HOST, MC_PORT, BOT_NAME).
minecraft:
  bridge:
    # Same variables as the bridge reads (.env at the repository root)
    host: "${BRIDGE_HOST:-localhost}"
    port: "${BRIDGE_PORT:-3000}"
    # For requests other than running an action (actions have no time limit: their answer is awaited)
    timeout_seconds: 60

  agent:
    # Ask the LLM for a new goal after this many steps (primitive actions) in one goal
    max_steps_per_goal: 40
    # ... or after this many failed steps in a row
    max_consecutive_failures: 3
    # ... or after this many steps without the remaining work going down
    max_stalled_steps: 8
    # The streamer's own notes (docs/design/18_notes.md), kept across restarts
    notes_path: "data/notes.json"
    # Blocks collected when found nearby even if no goal needs them (docs/design/79_windfall.md). Ores (coal,
    # copper, iron, lapis, redstone, gold, diamond, emerald) are always collected; this list is for the rest.
    # The bridge only mines what the carried pickaxe can (diamond needs iron, obsidian needs diamond) and
    # remembers the place of the rest; at most 64 of a drop are carried.
    collect:
      - obsidian
      - clay
      - sugar_cane
    # How actions are chosen (docs/design/21_tool_control.md):
    #   tools (the default): Gemini calls tools itself (and runs its skills; do_suggestion runs one
    #     of the bridge's candidates); Jev answers watch questions while a tool runs
    #   candidates: the bridge grounds candidates (solver) and Jev picks one (the old baseline, kept
    #     for comparison: --control candidates)
    control: "tools"
    # Each step in tools mode (docs/design/34 §3): jev = Jev picks first among the bridge's
    # candidates and the learned skills that worked and take no arguments; Gemini decides when Jev
    # picks "ask_gemini", is unsure, too slow, fails, after a failed tool, after
    # step_max_failures failed Jev steps, or every step_gemini_every steps. gemini = Gemini always
    step_picker: "jev"
    step_min_confidence: 0.5
    step_timeout_seconds: 3.0
    step_max_failures: 2
    step_gemini_every: 8
    step_record_dir: "logs/steps"   # per step: pick (options, chosen, confidence, probabilities, why Gemini) + result
    # After a small goal is stuck or stalled (docs/design/34 §7): jev = Jev first picks another
    # open job of the top objective (not the same kind) or "rethink" (Gemini analyses the failure);
    # Gemini always after 2 failures of the same kind, a death, a stalled objective or a screen
    # rethink. gemini = Gemini always analyses (design 27)
    failure_routing: "jev"
    # Every stuck_check_steps actions of a small goal Jev reads the action record (actions, results,
    # positions) and says whether the play is stuck (repeating, failing, back and forth, busy without
    # progress); a sure yes (>= stuck_min_confidence) ends the goal and Gemini rethinks with the
    # action record (design 27). 0: off (docs/design/34 §9)
    stuck_check_steps: 6
    stuck_min_confidence: 0.75
    # Also when the small goal's progress (remaining and the progress lines) has not changed for this
    # many minutes: Jev is given the action record then, without waiting for the next multiple of
    # stuck_check_steps (0: not by time)
    stuck_check_quiet_minutes: 5
    # Position, inventory, health, time of day and the small goal's progress unchanged while the actions
    # took this many seconds (after 2+ actions; waiting and sleeping do not count, nor does the time the
    # model takes to choose): no Jev, the LLM chooses again with the failures and results in view
    # (purpose tool_stuck). 0: off
    stagnation_seconds: 10
    stuck_record_dir: "logs/stuck"
    # Lesson book (docs/design/35): lessons from viewers' advice and own failures, with the situation
    # (goal, item, time, place, body, pickaxe, how the last goal ended), recalled in similar situations.
    # jev: code narrows by the situation, Jev checks each (< lesson_min_confidence: not shown);
    # rules: the code's top 3 only; off: not used (viewers' lessons go to the notes as before)
    lessons: "jev"
    lessons_path: "data/lessons.json"
    lessons_record_dir: "logs/lessons"
    lessons_shown: 4
    lesson_candidates: 6
    lesson_min_confidence: 0.6
    lesson_timeout_seconds: 2.0
    max_lessons: 200
    # Learned candidates (docs/design/52): a step the LLM chose that worked (a tool call with no coordinates:
    # craft, equip, smelt, ...) is remembered with the situation (goal, item, place) and offered to Jev
    # as "learned ..." beside the bridge's candidates in a similar situation; ones that stop working are dropped
    learned_candidates: true
    learned_candidates_path: "data/learned_candidates.json"
    learned_candidates_record_dir: "logs/learned_candidates"
    learned_candidates_shown: 3
    max_learned_candidates: 100
    # The current small goal and its step counts (docs/design/63): after a restart, resumed when the
    # bridge is still on the same small goal. Empty = not saved
    goal_path: "data/goal.json"
    # Search tools (docs/design/47 §3): search_facility / search_memory. Code narrows the list by
    # word overlap to 16, Jev picks the entry matching the query (or none); below
    # search_min_confidence or no answer → the 3 closest by words are returned as unsure
    search_min_confidence: 0.5
    search_timeout_seconds: 3.0
    search_record_dir: "logs/search"
    # How small goals are chosen (docs/design/26_steps_and_context.md):
    #   jev: Gemini writes the jobs for an objective; Jev picks the next job (and survival goals)
    #        at each boundary. Gemini is asked again after a failure, when the jobs run out, when
    #        Jev is unsure, and every replan_minutes (if the objectives changed; else 3x as long)
    #   gemini: Gemini decides every small goal (the previous behaviour, costs more)
    small_goals: "jev"
    jev_goal_min_confidence: 0.4
    replan_minutes: 20
    # When the top objective's progress (the counts of its conditions) stays the same over this many
    # actions for it, Gemini reconsiders it (another approach, explore far, move it down or drop it):
    # small goals ending as stalled could otherwise come back to the same one and circle. 0: off
    objective_stall_steps: 60
    goal_record_dir: "logs/goals"  # Jev's choices (options, chosen, confidence, why Gemini)
    goal_end_record_dir: "logs/goal_ends"  # per small goal that ends: how it ended, steps, seconds (tools/goal_outcomes.py; empty: none)
    run_record_dir: "logs/runs"  # per start of play: commit, settings, models (to compare results run by run; empty: none)
    # Skills (docs/design/22_skills.md, control: tools only): Gemini writes JS skills over the
    # tools, the bridge runs them in a sandbox and keeps the ones that worked
    # (minecraft-bridge/data/skills, set aside by world:reset; clean with npm run skills:clean)
    skills: true
    skill_rewrites_per_hour: 3   # rewrites of one skill (a cost cap)

  # Reflex when attacked (docs/design/28_jev_reflex.md). The bridge starts at once with its rule
  # (fight or flee) on a close mob, damage (even from afar or unseen) or a mob walking toward the bot;
  # Jev picks fight / flee / go_home / keep_distance / ignore from what is possible and the bridge
  # switches. Steps cut by an attack are not counted as failures of the small goal.
  reflex:
    judge: "jev"             # jev (needs TYPESAFE_API_KEY, else rules) | rules
    min_confidence: 0.5
    poll_seconds: 0.25       # how often GET /danger is read
    timeout_seconds: 0.8     # Jev's answer later than this keeps the rule
    record_dir: "logs/reflex"  # rule vs Jev per danger

  # Watching a running tool (control: tools). Jev answers all questions in one call per tick.
  watch:
    interval_seconds: 1.0
    grace_seconds: 2.0       # no questions in the first seconds of a tool
    threshold: 0.7           # confidence needed for a signal
    consecutive: 2           # signals in a row before acting
    act_on_progress: false   # the code's "is it progressing?" only records until it beats a rule
    act_on_questions: true   # Gemini's own watch questions stop / wake / report maybe-done
    record_dir: "logs/watch" # one JSONL per run: state, questions, answers, tokens (empty: none)

  # Showing Gemini the stream screen (docs/design/23; captured from OBS, see obs.game_source)
  vision:
    # 2026-09-27: off. In the log since 2026-09-25 (435 calls with a screenshot) no decision was found
    # that the screen turned around and that solved a difficulty; the screen misled twice (a tree
    # "right in front" that was not there; the POV client's disconnect screen). The text state (and
    # 「目の前のブロック」, design 45) covers what it saw. true: screenshots after failures and look_screen
    enabled: false
    # periodic check: does the screen match the goal? 0: off (costly; the screen still goes with
    # the goal decision after a failure, and look_screen in tools mode)
    review_interval_seconds: 0
    failure_interval_seconds: 60   # a screenshot goes with a rethink after failure at most this often

  # Supplies (docs/design/84): how many torches and how much food to keep, by how well the town's
  # infrastructure stands. A list, earliest first; the stage is the LAST entry reached. An entry is reached
  # when all its `after` playbook steps are done (the playbook above), or, with `or_mine`, when the bridge
  # has designed a mine. For each of torch / food: `low` = below this (carried + the home chest) a goal to
  # restock is offered; `carry` = how many to hold in hand (what a restock reaches, and what is taken from
  # the chest before going out); `stock` = carried + chest in total (the part above `carry` is a reserve
  # kept in the home chest). Without a chest in the home only the carried count exists. Torches are counted in
  # pieces, food in HUNGER POINTS (a full bar is 20; potato 1, raw pork 3, bread 5, cooked beef 8; a raw meat
  # counts as cooked only when a furnace is known), docs/design/84 §8. Early on, food is kept small: with no
  # farm yet, a big stock meant a long hunt before the real task (2026-10-02; 24 = 8 raw meats).
  supplies:
    - name: early
      torch: {low: 8, carry: 16, stock: 16}
      food: {low: 12, carry: 24, stock: 24}
    - name: settled          # the farm stands and has been harvested
      after: [food]
      torch: {low: 16, carry: 16, stock: 32}
      food: {low: 40, carry: 80, stock: 160}
    - name: mining           # real mining: the iron step is now (lumber done) or a mine is designed
      after: [lumber]
      or_mine: true
      torch: {low: 32, carry: 64, stock: 128}   # at least one stack in hand
      food: {low: 100, carry: 160, stock: 320}

  # Goal hierarchy (docs/design/13_goal_hierarchy.md): the mission never changes on stream;
  # objectives are worked on from the top, completed when their conditions hold in the world.
  # Conditions: built / placed (item: bed) / have (item, count)
  mission:
    text: "生き延びながら家を建て、街にしていく"
    # The first objectives when nothing is saved (the playbook below is what the code keeps in order)
    objectives: []
    # Playbook (docs/design/74): the standard opening of the town, in this order. Only the first step
    # not yet done is an objective, always at the top; the code refuses to move it, drop it or put
    # another objective before it (survival goals — hunger, night, death — are small goals and still
    # interrupt). A step is done for good once all its conditions hold at once. A step is the whole
    # cycle (set up, then the first harvest), so a facility condition may sit beside others; materials
    # for it (a bucket for the farm's water: iron) are jobs of the step, not a step of their own.
    # `keep` (a step that has to stay true) reopens the step when its conditions stop holding.
    # `ready` (some of the conditions) is the set-up being finished while the plants only have to grow:
    # the next step may then be worked on at the same time (two steps at most; a third waits until both
    # are done), the step that needs hands first and the growing one behind it. A facility in `ready` with
    # `started: true` holds once a quarter of its cells are planted: seeds and saplings are searched for
    # only up to that quarter, the rest is filled from what the grown plants give (docs/design/74 §7).
    # To add a rule, add an entry here: name (unique), title, conditions, reason. A facility name is
    # designed on first use (the farm / tree farm layout), so keep it short and unique.
    playbook:
      - name: shelter
        title: "自分の家を作る"
        conditions: [{predicate: built}]
        keep: true   # a house the creepers blew up (walls, or the ground under it) makes it the current step again (docs/design/88)
        reason: "夜を安全に過ごす拠点"
      - name: bed
        title: "夜に寝られるようにする"
        conditions: [{predicate: placed, item: bed}]
        reason: "夜を飛ばして昼に活動する"
      - name: weapon
        title: "身を守る道具を持つ"
        conditions: [{predicate: have, item: sword, count: 1}]
        keep: true   # a lost sword (death) makes it the current step again
        reason: "敵と戦えるようにする（死ぬと持ち物を失うので、畑より先に。地下へ出るにも要る）"
      - name: food
        title: "小麦畑を作って、最初の収穫まで回す"
        conditions: [{predicate: facility, name: wheat_farm_1}, {predicate: have, item: wheat, count: 3}]
        ready: [{predicate: facility, name: wheat_farm_1, started: true}]   # a quarter planted: the crops only have to grow, the next step may start
        reason: "食料を安定して手に入れる基盤。牛や羊を探して遠くまで往復すると、走るぶんの空腹で得がほとんど残らない。種は全マスの 1/4 だけ集めてまき、残りは育った小麦を収穫して出る種で増やす（草を掘って探し回らない）。畑の水に要る桶（鉄 3）は、この段の中目標として鉄を集めてよい"
      - name: yard
        title: "家のまわりを床と同じ高さの平地にそろえる"
        conditions: [{predicate: leveled, where: home, distance: 6}]
        reason: "家のまわりが穴や出っ張りだらけだと、ドアの前で足を取られ、モブが隠れ、爆発の穴も残る。施設（畑・採掘場の入口）の場所は整地が避ける。食料が回り出してから（土を掘って埋める作業で畑が遅れないように）"
      - name: lights
        title: "家のまわりを松明で明るくする"
        conditions: [{predicate: lit, distance: 8}]
        reason: "暗い所にはクリーパーなどが湧く。家のそばで湧かせず、壁を吹き飛ばされないようにする（畑が育つのを待つ間に。畑より先にすると、松明の材料で畑が遅れる）"
      - name: lumber
        title: "植林場を作って、最初の原木を取るまで回す"
        conditions: [{predicate: facility, name: oak_grove_1}, {predicate: have, item: oak_log, count: 16}]
        ready: [{predicate: facility, name: oak_grove_1, started: true}]
        reason: "建材（木）を安定して手に入れる基盤。木を探して歩き回らずに、家のそばで原木を取る。苗木は全マスの 1/4 だけ集めて植え、残りは育った木の葉から出る苗木で増やす（森を探し回らない）"
      - name: iron
        title: "鉄の道具をそろえる"
        conditions: [{predicate: have, item: iron_pickaxe, count: 1}, {predicate: have, item: iron_sword, count: 1}]
        reason: "資材（鉄）。鉄のつるはしで先の鉱石（ダイヤなど）に進める"
    # Limits the code keeps (not left to the model)
    max_objectives: 6
    max_viewer_objectives: 2       # at a time; one per viewer
    viewer_budget_steps: 80       # a viewer's objective is dropped (and told) after this many steps
    # Carried on across restarts while the mission text stays the same
    store_path: "data/mission.json"

# Logging
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  file: "data/logs/ailoveshen.log"
  rotation: "10 MB"
  retention: "7 days"
  compression: "zip"
  # Separate log for filter results (for analysis)
  filter_log: "data/logs/filter_results.jsonl"
