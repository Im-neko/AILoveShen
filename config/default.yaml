# AILoveShen Default Configuration
# Environment-specific values should be in development.yaml or production.yaml

app_name: AILoveShen
debug: false

# The stream (python -m ailoveshen.stream, docs/streaming.md)
stream:
  board_port: 8765         # goal board, avatar and debug pages for OBS; 0: off
  speak: true              # read the commentary and replies aloud (the TTS server must be up)

# Twitch Integration
twitch:
  enabled: true
  channel: "${TWITCH_CHANNEL:-}"
  client_id: "${TWITCH_CLIENT_ID:-}"
  client_secret: "${TWITCH_CLIENT_SECRET:-}"
  access_token: "${TWITCH_ACCESS_TOKEN:-}"

  # Replies to chat (python -m ailoveshen.stream). The chat is read anonymously: only the channel
  # is needed (TWITCH_CHANNEL), no token.
  response:
    min_interval_seconds: 5.0
    backlog: 3             # comments kept while a reply is being made (the newest ones)

  # Reconnection settings
  reconnect:
    enabled: true
    base_delay_seconds: 1.0
    max_delay_seconds: 300.0
    exponential_base: 2.0
    # Server errors: infinite retry with backoff
    # Client errors: no retry

# Comment Filter (Gemini Flash)
comment_filter:
  enabled: true
  # Dynamic threshold based on comment volume
  base_threshold: 0.5
  min_threshold: 0.3
  max_threshold: 0.9
  # Volume measurement window
  window_seconds: 60
  # Messages per minute thresholds
  low_volume_mpm: 5.0
  high_volume_mpm: 30.0
  # Filter results logging
  log_results: true

# Gemini API
gemini:
  api_key: "${GEMINI_API_KEY:-}"
  main_model: "gemini-3.8-flash"
  filter_model: "gemini-3.8-flash"
  # thinking_level: low / medium / high (3.8 Flash rejects "minimal").
  # temperature/top_p/top_k were removed in 3.8 Flash.
  # main=low: measured 2026-09-24, median ~1.6-1.9s vs ~2.9-3.1s for medium
  # with no noticeable quality difference for 1-2 sentence utterances.
  main_thinking_level: "low"
  filter_thinking_level: "low"
  # Includes thinking tokens. Too small a value yields truncated or empty output.
  # Measured total usage peaks around 1.3k tokens (medium); 8192 is headroom.
  max_output_tokens: 8192
  # thinking_level per purpose (docs/design/19 §7, 21 §7). Purposes not listed use
  # main_thinking_level. high is unmeasured (it may hit max_output_tokens): measure before relying on it.
  thinking_levels:
    town: "high"               # the town definition
    site: "high"               # choosing the town site
    house: "medium"            # designing the house
    build_design: "high"       # designing a named build (docs/design/25_builds.md)
    goal: "low"                # the small goal (with mid-goal edits and notes)
    goal_after_failure: "medium"
    tool: "low"                # one tool call (control: tools)
    tool_after_failure: "medium"
    commentary: "low"
    reply: "low"               # a viewer is waiting
    screen_review: "medium"    # comparing the stream screen with the goal (docs/design/23)
  # Debugging: ask for thought summaries and keep the last calls (purpose, level, thoughts,
  # output, tokens) for GET /api/debug/gemini and /debug/gemini on the goal board (--board-port)
  # Thought summaries cost output tokens on every call: off by default, on with --debug
  include_thoughts: false
  debug_log_size: 50
  # Resolution of attached screenshots (low / medium / high): lower costs fewer image tokens
  media_resolution: "low"
  media_resolutions:
    build_design: "medium"     # the top-down map for placing a build (docs/design/25)

  # Retry settings (max_attempts includes the original request;
  # retried on 408/429/5xx only)
  retry:
    max_attempts: 3
    base_delay_seconds: 1.0
    max_delay_seconds: 10.0
    exponential_base: 2.0

  # Rate limit settings
  rate_limit:
    min_interval_seconds: 1.0

# AI Streamer Character
character:
  name: "AILoveShen"
  description: |
    明るく元気なAI配信者。
    Minecraftが大好きで、建築よりも冒険派。
    視聴者との交流を楽しんでいる。
  speech_style: |
    フレンドリーで親しみやすい話し方。
    時々ゲームに熱中して独り言が多くなる。
  first_person: "私"
  sentence_endings:
    - "だよ"
    - "だね"
    - "かな"
    - "！"
  personality_traits:
    - "好奇心旺盛"
    - "ポジティブ"
    - "ちょっとおっちょこちょい"
    - "視聴者思い"

# TTS (Style-Bert-VITS2)
tts:
  enabled: true

  # Server connection settings
  server:
    host: "localhost"
    port: 5001
    timeout_seconds: 30

  # Voice settings
  voice:
    model_name: "${TTS_MODEL_NAME:-shen}"  # Directory name under Style-Bert-VITS2/model_assets
    speaker_id: 0
    language: "JP"
    default_style: "Neutral"

  # Synthesis parameters
  synthesis:
    sdp_ratio: 0.2
    noise: 0.6
    noisew: 0.8
    length: 1.0

  # Queue settings
  queue:
    max_size: 10

  # Audio output settings
  audio:
    # device: null = default device
    # Windows (VB-Audio Cable): "CABLE Input (VB-Audio Virtual Cable)"
    # macOS (BlackHole): "BlackHole 2ch"
    device: null
    blocksize: 1024

  # Emotion to Style mapping (for EmotionStyleService)
  # The shen model only has the "Neutral" style (unknown styles return 422).
  # Emotions are expressed by the avatar (Live2D), not the voice.
  emotion_style_map:
    neutral: "Neutral"
    happy: "Neutral"
    sad: "Neutral"
    angry: "Neutral"
    surprised: "Neutral"
    scared: "Neutral"
    excited: "Neutral"

# MCP Settings
mcp:
  enabled: true

  memory:
    short_term_capacity: 20
    long_term_db: "data/memory.db"
    # Auto-save memories with importance >= HIGH
    auto_save_min_importance: "high"

  emotion:
    default_state: "neutral"
    decay_rate: 0.1
    neutral_threshold: 0.3
    # Decay is applied when generating commentary

# Live2D (VTube Studio) Integration
live2d:
  enabled: true

  vtube_studio:
    host: "localhost"
    port: 8001
    timeout_seconds: 10

  plugin:
    name: "AILoveShen"
    developer: "AILoveShen"

  auth:
    token_file: "data/.vts_token.json"

  # Emotion to Expression mapping
  emotion_expression_map:
    neutral: "neutral.exp3.json"
    happy: "happy.exp3.json"
    sad: "sad.exp3.json"
    angry: "angry.exp3.json"
    surprised: "surprised.exp3.json"
    scared: "scared.exp3.json"
    excited: "excited.exp3.json"

  sync:
    auto_sync_emotions: true
    intensity_threshold: 0.3
    default_expression: "neutral.exp3.json"

# The streamer's avatar (docs/design/24_avatar.md): a VRM shown at /avatar on the goal board
# (--board-port), an OBS browser source with a transparent background
avatar:
  model_path: "models/vrm/ailoveshen.vrm"
  # Where the mouth movement comes from: auto (the TTS playback events when they come, otherwise
  # the generated text with an estimated length) / text / tts
  lip_sync: "auto"
  # Who picks the expression and gesture: jev (Jev reads the situation and the line; the rules
  # below it are the fallback on failure, timeout or low confidence) / rules (rules only)
  judge: "jev"
  judge_timeout_seconds: 1.5
  record_dir: "logs/avatar"   # Jev's and the rules' answers side by side (empty: none)

# OBS WebSocket (OBS 28+ / WebSocket 5.x)
obs:
  enabled: true
  host: "localhost"
  port: 4455
  password: "${OBS_PASSWORD:-}"
  # Gemini sees the stream screen (docs/design/23): the name of the OBS source that shows the
  # game (the POV client on 127.0.0.1:25578). Never the whole scene (the goal board would show).
  # Empty: no screenshots. Without OBS the play goes on text only.
  game_source: "${OBS_GAME_SOURCE:-Minecraft}"
  screenshot_width: 768
  screenshot_quality: 70
  timeout_seconds: 3
  retry_seconds: 60        # after a failed capture, no capture for this long

  # Scene name mapping (configure actual names in OBS)
  scenes:
    main: "Main Scene"
    starting: "Starting Soon"
    ending: "Ending"
    brb: "Be Right Back"

  # Subtitle settings (font/position configured in OBS)
  subtitle:
    source_name: "Subtitles"
    # Default: persistent display (null = no auto-hide)
    default_duration_seconds: null

# Game Integration (Abstract layer for multiple games)
game:
  enabled: false

  # Current game adapter
  adapter: "minecraft"  # Future: "terraria", "factorio", etc.

  # Action execution
  action_timeout_seconds: 5
  enable_parallel_actions: true
  action_queue_size: 10

  # State polling
  polling_interval_ms: 100

  # Event detection
  events:
    health_change_threshold: 5

# Jev (TypeSafe AI System One): picks the next action within the LLM's goal
jev:
  api_key: "${TYPESAFE_API_KEY:-}"
  model: "jev-latest"
  timeout_seconds: 10

# Minecraft (Mineflayer bridge sidecar: minecraft-bridge/)
# Server connection and bot name are the bridge's env vars (MC_HOST, MC_PORT, BOT_NAME).
minecraft:
  bridge:
    # Same variables as the bridge reads (.env at the repository root)
    host: "${BRIDGE_HOST:-localhost}"
    port: "${BRIDGE_PORT:-3000}"
    # Must exceed the bridge's longest action timeout (45s, TIMEOUTS_MS in primitives.mjs)
    timeout_seconds: 60

  agent:
    # Ask the LLM for a new goal after this many steps (primitive actions) in one goal
    max_steps_per_goal: 40
    # ... or after this many failed steps in a row
    max_consecutive_failures: 3
    # ... or after this many steps without the remaining work going down
    max_stalled_steps: 8
    # The streamer's own notes (docs/design/18_notes.md), kept across restarts
    notes_path: "data/notes.json"
    # How actions are chosen (docs/design/21_tool_control.md):
    #   candidates: the bridge grounds candidates (solver) and Jev picks one (the baseline)
    #   tools: Gemini calls tools itself; Jev answers watch questions while a tool runs
    control: "candidates"
    # How small goals are chosen (docs/design/26_steps_and_context.md):
    #   jev: Gemini writes the steps for a mid goal; Jev picks the next step (and survival goals)
    #        at each boundary. Gemini is asked again after a failure, when the steps run out, when
    #        Jev is unsure, and every replan_minutes (if the mid goals changed; else 3x as long)
    #   gemini: Gemini decides every small goal (the previous behaviour, costs more)
    small_goals: "jev"
    jev_goal_min_confidence: 0.4
    replan_minutes: 20
    goal_record_dir: "logs/goals"  # Jev's choices (options, chosen, confidence, why Gemini)

  # Watching a running tool (control: tools). Jev answers all questions in one call per tick.
  watch:
    interval_seconds: 1.0
    grace_seconds: 2.0       # no questions in the first seconds of a tool
    threshold: 0.7           # confidence needed for a signal
    consecutive: 2           # signals in a row before acting
    act_on_progress: false   # the code's "is it progressing?" only records until it beats a rule
    act_on_questions: true   # Gemini's own watch questions stop / wake / report maybe-done
    record_dir: "logs/watch" # one JSONL per run: state, questions, answers, tokens (empty: none)

  # Showing Gemini the stream screen (docs/design/23; captured from OBS, see obs.game_source)
  vision:
    enabled: true
    # periodic check: does the screen match the goal? 0: off (costly; the screen still goes with
    # the goal decision after a failure, and look_screen in tools mode)
    review_interval_seconds: 0
    failure_interval_seconds: 60   # a screenshot goes with a rethink after failure at most this often

  # Goal hierarchy (docs/design/13_goal_hierarchy.md): the mission never changes on stream;
  # mid goals are worked on from the top, completed when their conditions hold in the world.
  # Conditions: built / placed (item: bed) / have (item, count)
  mission:
    text: "生き延びながら家を建て、街にしていく"
    mid_goals:
      - title: "自分の家を作る"
        conditions: [{predicate: built}]
        reason: "夜を安全に過ごす拠点"
      - title: "夜に寝られるようにする"
        conditions: [{predicate: placed, item: bed}]
        reason: "夜を飛ばして昼に活動する"
      - title: "身を守る道具を持つ"
        conditions: [{predicate: have, item: wooden_sword, count: 1}]
        reason: "敵と戦えるようにする"
      - title: "食料を蓄える"
        conditions: [{predicate: have, item: food, count: 8}]
        reason: "空腹で動けなくならないように"
    # Limits the code keeps (not left to the model)
    max_mid_goals: 6
    max_viewer_mid_goals: 2       # at a time; one per viewer
    viewer_budget_steps: 80       # a viewer's mid goal is dropped (and told) after this many steps
    # Carried on across restarts while the mission text stays the same
    store_path: "data/mission.json"

# Logging
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  file: "data/logs/ailoveshen.log"
  rotation: "10 MB"
  retention: "7 days"
  compression: "zip"
  # Separate log for filter results (for analysis)
  filter_log: "data/logs/filter_results.jsonl"
