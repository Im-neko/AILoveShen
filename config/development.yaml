# AILoveShen Development Configuration
# Inherits from default.yaml, overrides only what's needed

debug: true

llm:
  local:
    # Purposes the local model thinks for (all others: no thinking). Thinking is slow locally, so the
    # everyday calls (tool_after_failure, commentary, live, reply) do not think; the goal decisions do
    # (they are few and plan the next minutes; user 2026-09-27), and so does the tool choice (user
    # 2026-09-28); town_plan draws the town's master plan (docs/design/47 §9), facility_design lays out
    # a farm or tree farm (47 §7); [] = never think
    # tool_stuck (the tool choice while the small goal keeps failing) does not think: measured over
    # 2026-09-29/30, 108 calls took 55 s on average (99 minutes, a third of all LLM time) and 48% of
    # them worked, against 44% for tool_after_failure (6 s, no thinking); the last 30 minutes of
    # 2026-09-30 13:19-13:49 had 9 calls of 52 s (max 133 s) and a death during a 39 s one
    thinking_purposes: []
    # Nothing thinks and every purpose has an output cap (default.yaml), so a call over 90 s is hung; before, a
    # request waited its 180 s and the play stood still (2026-09-30 13:23)
    timeout_seconds: 90
logging:
  level: "DEBUG"
  file: "data/logs/ailoveshen-dev.log"
tts:
  audio:
    device: "BlackHole 2ch"
    gain_db: 6.0   # the voice was too quiet in OBS even with the fader at the maximum (0 dB): lower it if it sounds harsh
  # Neutral は Irodori-TTS が説明なしで読んだ音声から、感情のスタイルは感情つきで読んだ音声から
  # （tools/sbv2_add_styles.py）。元の録音の Neutral は Neutral-01
  emotion_style_map:
    neutral: "Neutral"
    happy: "Happy"
    surprised: "Surprised"
    sad: "Sad"
    angry: "Angry"
    scared: "Scared"
    excited: "Excited"
  synthesis:
    style_weight: 1.0   # 感情の強さ（1 で弱ければ上げる。上げすぎると声が崩れる）
