# やり方の帳（docs/design/47 §4.1）: 道具 search_abilities で引く。プレイする LLM（Qwen3.6、考えない）は
# Minecraft の知識が少ないので、できることを検索で教える。機能を足したらここにも足す（CLAUDE.md）。
#
# 1 項目: key（英小文字と _）、title（日本語）、words（英語の検索語）、when（どんなときに）、
# how（手順。道具の名前と引数で書く）、tools（how で使う道具。tests/unit/infrastructure/test_abilities.py が
# 道具の一覧にあるかを確かめる）、see（関連する項目の key）
- key: make_farm
  title: 畑を作る・増やす
  words: farm field crops farmland till sow hoe wheat carrot potato beetroot facility 畑
  when: 食べ物（パン、ニンジン、ジャガイモ）を毎日取れるようにしたいとき、大目標が farmed のとき
  how: |
    畑は作る前に設計する: 大目標の条件に facility(name) を書く（名前は街の理想図の予定の施設名。
    なければ新しい名前）。そのとき区画・作物・大きさを決め、耕すマスが決まる
    1. クワと種を持つ（クワはなければ craft で wooden_hoe など。材料は recipe_of。小麦の種は草を dig
       すると 1 割ほど落ちる: get_seeds）
    2. till と sow の x,y,z を省くと、畑の次のマスを選ぶ（小目標 facility(name) ならその畑、
       farmed ならその作物の畑。草が生えていれば刈ってから耕す）。畑のマスの外は耕せない
    3. sow {item} で耕地に種をまく（wheat_seeds / carrot / potato / beetroot_seeds）
    畑の四角の中には、9 x 9 ごとに 1 マス、水のマスがある（設計で決まる）。水のバケツがあれば water で置く
    （水を置く手順は water_farm）。水が届いた耕地は、何も植わっていなくても土に戻らない
    水が届く前は、耕すのは 1 マスずつ、耕したらすぐまく。まく種が耕し済みのマスに足りないと till は
    断られる（何も植わっていない耕地は、水が近くにないと土に戻るから。種がないまま耕し続けない）
    畑は、四角と柵の輪の地面の高さをそろえてから耕し（整地）、四角の 1 マス外側を柵で囲い、1 か所に柵のゲートを
    付ける。整地・柵・ゲートは、小目標 facility(name) の候補（do_suggestion: 「level the ground of the farm」
    「put up the fence around the farm」「put the fence gate of the farm」）で進める。柵は板と棒で作る
    （craft {item: oak_fence}、ゲートは oak_fence_gate）。全部そろって、畑が済みになる
    畑が崩れたら（作物のマスの地面が穴・丸石・石になったら）、整地の候補で直す。掘って土で埋め直す。土は街の外から集める
    種は畑の数 × 1 スタック（持ち物とチェストの合計）まで。余りは toss で捨てる（街から離れた所へ歩いて捨てる。候補にも出る）。ニンジン・ジャガイモは捨てない
    畑の場所・作物・残りのマスは search_facility（例: 畑、wheat farm）
  tools: [till, sow, water, craft, recipe_of, search_facility, do_suggestion, toss]
  see: [get_seeds, harvest_crops, water_farm, plant_trees]

- key: harvest_crops
  title: 作物を収穫する
  words: harvest crops ripe wheat carrots potatoes beetroots bread
  when: 畑の作物が熟したとき、小麦・ニンジン・ジャガイモが要るとき
  how: |
    1. search_facility で畑の場所と熟した数（ripe）を調べる。find_blocks {block: wheat} は ripe と age を返す
    2. 熟した作物を dig {x,y,z} する。5m 以内の熟した作物もまとめて収穫し、拾った種でまき直す
    未熟な作物の dig は断られる。作物はプレイヤーの近くでしか育たない（遠くへ行くと止まる）
    骨粉を持っていれば use_item {item: bone_meal, x,y,z} で早く育つ
    小麦 3 つでパン（craft {item: bread}）
  tools: [search_facility, find_blocks, dig, use_item, craft]
  see: [make_farm, water_farm]

- key: water_farm
  title: 畑に水を引く
  words: water farm farmland moisture dry hydrate bucket irrigation 水 水路 乾いた 水のマス
  when: 畑の水のマスにまだ水がないとき（search_facility の to_water）、乾いた耕地（dry）があるとき、作物の育ちが遅いとき、視聴者に水を言われたとき
  how: |
    畑を設計するとき、四角の中に 9 x 9 ごとに 1 マス水のマスが決まる（そこから縦横 4 マス以内の耕地が湿る）。
    水が届いた耕地は、何も植わっていなくても土に戻らず、作物が速く育つ。水のマスは search_facility の to_water
    1. バケツを作る: craft {item: bucket}（鉄インゴット 3。材料は recipe_of。鉄は鉄鉱石を掘って精錬する）
    2. 水源（流れていない水）で use_item {item: bucket, x,y,z}（水のブロックの座標）で汲む → water_bucket
    3. water {}（x,y,z を省くと畑の次の水のマス）。水のマスの地面を掘って穴にし、その底に水を置く。
       水のマス以外には置けない（畑の中の好きなマスを掘らない: 耕すマスが減って畑が完成しなくなる）
    小目標 facility(name) は、水のバケツを持っていれば水のマスを先に出し、なければバケツを手に入れる手順
    （鉄でバケツを作り、水を汲む）を出す。耕す・まくはその間も進められる
    湿ったかは find_blocks {block: farmland} の props か、search_facility の dry で確かめる
  tools: [craft, recipe_of, use_item, water, find_blocks, search_facility]
  see: [make_farm, harvest_crops, use_items]

- key: get_seeds
  title: 種を集める
  words: seeds wheat_seeds grass short_grass tall_grass
  when: 畑にまく種がないとき
  how: |
    草（short_grass / tall_grass / fern）を dig {x,y,z} すると、ときどき（1 割ほど）wheat_seeds が落ちる
    1 回の dig で、何か落ちるまで 5m 以内の同じ草を続けて掘る。何も落ちなくても失敗ではない
    熟した小麦を収穫しても種が取れる。ニンジンとジャガイモは村の畑か、ゾンビがまれに落とす
    畑の種は、最初は全マスの 1/4 だけ草から集めてまく。残りは、育った小麦を収穫して出る種で増やす
    （草を探し回らない。種を手に入れるたびに、まけるだけまく）
  tools: [dig]
  see: [make_farm]

- key: plant_trees
  title: 苗木を植える・植林場を作る
  words: plant trees sapling tree farm forest logs wood facility 植林場
  when: 近くに木がない、原木を毎回遠くへ取りに行っているとき、大目標が planted のとき
  how: |
    植林場は作る前に設計する: 大目標の条件に facility(name) を書く（名前は街の理想図の予定の
    施設名。なければ新しい名前）。そのとき区画・苗木の種類・本数・間隔を決め、植えるマスが決まる
    1. 苗木は葉（*_leaves）を dig するとときどき（5%）落ちる。原木を取るときに葉も掘る
       最初は全マスの 1/4 だけ集めて植え、残りは育った木の葉から出る苗木で増やす（森を探し回らない）
    2. plant {item} の x,y,z を省くと、植林場の次のマスを選ぶ（小目標 facility(name) ならその
       植林場）。植林場のマスの外は、ブリッジが断ることがある（理由と次のマスが返る）。
       全部のマスに木があると施設が完成
    植えた木と植林場は search_facility（例: 植林場、tree farm）で見られる
  tools: [dig, plant, search_facility]
  see: [gather_wood, make_farm]

- key: gather_wood
  title: 原木を集める
  words: wood logs tree oak birch spruce planks sticks
  when: 板材・棒・作業台・道具の材料が要るとき
  how: |
    1. 「目の前のブロック」に *_log があればその座標を dig。なければ find_blocks {block: oak_log}
    2. 見えなければ search_memory（例: oak_log、木）で前に見た森、search_facility で植林場。find_blocks は
       読み込まれていない所や半径の外も、前に見た記録（source: map）から返す
    高い幹は土を持っていれば積んで届く（地面から 5 + 持っている土の数、最大 16 段上まで）。葉が散って
    浮いた幹（find_blocks の leftover: true）も集めてよい
    原木 1 つで板材 4 枚、板材 2 枚で棒 4 本（craft）
  tools: [find_blocks, dig, search_memory, search_facility, craft]
  see: [plant_trees]

- key: mine_ores
  title: 石と鉱石を掘る
  words: mine mining stone cobblestone ore iron coal diamond gold pickaxe cave
  when: 丸石、石炭、鉄、ダイヤが要るとき
  how: |
    ツルハシが要る: 木のツルハシで石・石炭、石のツルハシで鉄、鉄のツルハシでダイヤ・金・レッドストーン
    （item_info {query: raw_iron} で要る道具と、どのブロックから取れるかが分かる）
    1. 目の前や find_blocks で見える鉱石を dig
    2. search_memory（例: iron_ore、鉄）で前に見た鉱石へ goto
    3. 地下の鉱石と石は、家があるとき採掘場から取る（自分で建てた家。設計書 68。do_suggestion で選ぶ）: 提案 make a mine down to y … は、
       家の外周（壁から 10〜30 m）に、鉱石の高さまで下りるらせん階段と、底の部屋から東西へ延びる坑道（幹）に
       3 マスおきの枝（左右へ 10 マス）をつけたブランチマイニングを設計して掘る。
       途中なら dig the mine …（探している鉱石が壁に出たらそこで止まるので、見えた鉱石を dig）、
       下りきったら go down the mine … で底へ行く。底まで掘り尽くして鉱石が出なければ、別の入口に新しい採掘場を作る。
       採掘場のほかの岩を掘って近道しない（経路探索は採掘場の坑道と枝以外の深い岩を掘らない）。
       坑道や枝が洞窟（空洞）に出たら、手元の丸石で床・壁・天井を作って塞ぐ（丸石が足りなければ、その枝は打ち切る）
       家がない間は、提案 dig down …（階段を掘って下りる。入口から 4 段より深い所で洞窟に出たら、階段も丸石で塞ぐ。
       丸石が足りなければそこで止まる: 先に石を掘って丸石を持つ）
    鉱石を dig したら、拾ったあとに穴を土か丸石で埋め直す（結果に filled the hole と出る。敵が近い・体力が低い・
    埋める物がないときは開けたまま）。通路にする所（採掘場の計画・家・建物）は埋めない
    石は、家があるとき地表から 10 マス以上下でないと掘れない（地表の石は around の shallow に数だけ出て、dig は断られる）。
       採掘場の壁の石を掘る。土・砂利・鉱石は地表でもよい
    採掘場には松明を置く（階段は 6 段おき、坑道は 6 マスおき、枝は 5 マス目）。サーバーが送る実際の光を見て、
    光が 2 未満（0 はモブが湧く）の掘り終えたセルが近くにあれば、間隔の外でも足す。掘り始める前にも、暗いセルが残って
    いれば先に松明で明るくする。松明を持っていないと dig_mine は始まらず（暗いセルがあるときも）、
    掘っている途中で尽きればそこで止まる（理由に出る）。先に作る（暗い所で 4 本未満なら、状態の needs にも出る）
    石・土・砂利は、状態の「採掘の場所」の近くから掘る（around と find_blocks の quarry: true が印）。
    毎回別の所を掘ると家のまわりが穴だらけになる。家がなく階段を掘るとき、前に掘った階段の底から続けて掘られる
    鉄鉱石は raw_iron になり、かまどで iron_ingot に焼く。
    石炭や鉄が見えないときは、歩き回って探すより採掘場から集める（make_mine。家がなければ探索の提案）。
    松明の石炭は、かまどがあれば木炭（原木を焼く）でもよい: ソルバーが安いほうを選ぶ
  tools: [dig, find_blocks, search_memory, goto, do_suggestion, item_info]
  see: [smelt, upgrade_tools, make_mine]

- key: make_mine
  title: 採掘場を作る
  words: mine shaft stairs tunnel branch mining iron diamond deep facility 採掘場
  when: 鉄やダイヤを何度も取りに行く、毎回その場で階段を掘り下げているとき、石炭や鉄が見えず探し回っているとき
  how: |
    家があるとき、採掘場はブリッジが自分で設計する（提案 make a mine down to y …。書かなくてよい）。
    家の外周の 10〜30 m、入口は前の採掘場と同じ行に揃え、鉱石の高さ（石炭・銅 y 32、鉄 16、ラピス 0、金 -16、
    レッドストーン・ダイヤ -58）まで階段で下りて、東西の坑道（長さ 32、危なければ短く）と 3 マスおきの枝（長さ 10）を掘る。
    坑道と枝が洞窟に出たら丸石で塞ぐ。個数の上限はない。
    次のは、大目標の条件で名前を決めて設計するとき:
    採掘場は作る前に設計する: 大目標の条件に facility(name) を書く（名前は街の理想図の予定の
    施設名。なければ新しい名前）。そのとき区画・底の高さ（鉄は y 16 あたり）・坑道の本数と長さを
    決める。溶岩や水に当たる深さは断られ、届く一番深い y が返る
    1. ツルハシを持つ（なければ craft。材料は recipe_of）
    2. 小目標 facility(name) の間、提案 dig the mine … を do_suggestion で選ぶと、らせん階段を
       底まで掘り、部屋と坑道を掘る（1 回で危ないものに当たるまで続ける）。溶岩や水に当たると、
       そこで採掘場は終わりになり理由が残る
    3. 完成した採掘場は、深い石・鉱石が要るとき提案 go down the mine … でそこから下りる
    採掘場の場所・深さ・掘った数は search_facility（例: 採掘場、mine）
  tools: [do_suggestion, craft, recipe_of, search_facility]
  see: [mine_ores]
- key: breath
  title: 水の中で息を続ける
  words: water underwater swim breath air drown ocean lake river 水 泳ぐ 息 溺れる 水面
  when: 水の中にいる、潜る、水を渡るとき（欲求に「your head is underwater (air N/20)」が出る）
  how: |
    頭が水の中にいる間、息（気泡 20 = 15 秒）が減る。0 になると毎秒 2 ダメージ。
    息が続かなくなりそうになると、反射が自動で動いている行動を止め、息のできる所（水面、天井の穴、空気のある所）へ
    泳ぐ（頭の上が塞がっていれば横へ）。その間は道具や行動が断られる。浮いたら、選び直し。
    水を長く渡るなら泳がず、ボートを使う（12 m 以上の水は自動）。長く潜る用がなければ、水の中の掘りや歩きは避け、
    goto で水の外の場所を選ぶ
  tools: [goto]
  see: []

- key: smelt
  title: かまどで焼く・精錬する
  words: smelt furnace cook ingot iron glass charcoal stone fuel
  when: 鉄のインゴット、焼いた肉、木炭、ガラス、石が要るとき
  how: |
    精錬・調理は家の中のかまどだけ（地下や野外で置いて立ち止まると、モブに撃たれ続けて死ぬ。家がまだないときだけ、
    地上で置いてよい。地下では置かない・使わない）。生鉄や生肉は持って帰り、家で焼く
    1. かまどがなければ丸石 8 個で craft {item: furnace} して、家の中に place する（外では place が断られ、
       提案は「go home to place the furnace inside the house」になる）
    2. 家に着いたら smelt {input, count} で家のかまどで焼く。燃料は持ち物から選ぶ（石炭・木炭は 8 個、板材・原木は 1.5 個焼ける）
    例: raw_iron → iron_ingot、beef → cooked_beef、oak_log → charcoal、sand → glass、cobblestone → stone
    焼いている途中のかまどは search_memory（例: furnace）で見られる
  tools: [craft, place, smelt, search_memory]
  see: [cook_food]

- key: cook_food
  title: 肉を焼く・食べる
  words: food eat edible cook meat beef porkchop chicken mutton hunger bread recipe 食べ物 食べられる 食料 料理
  when: おなかが減ったとき、食べ物を蓄えたいとき、何が食べられるか・どう作るか分からないとき
  how: |
    食べ物が要るときは、まず find_foods（query なし）の now: 足りない満腹度（満タンは 20、体力が減っているなら 18 以上で回復する）、
    持ち物と家のチェストの満腹度の合計、見えている動物（落とす物と満腹度）、熟した作物、覚えている動物の場所。歩くと 40〜70 m で 1 減るので、
    遠い牛より近い作物やチェストが得
    何が食べられて、どう手に入るかは find_foods {query?, have?}（満腹度、レシピの材料、かまどで焼く元、畑、狩り。持ち物で食べられる・作れる物が先。小麦のように食べられない物は出ない）
    eat {item} で食べる。足りない満腹度に合う物から食べる（満腹に近いときに焼いた肉は食べない）。体力が減っているときは満腹度 18 以上まで食べる。生肉は飢えているとき（満腹度 6 以下）か、かまどがなくて満腹度 12 以下のときだけ
    生肉は smelt {input: beef, count} で焼く（かまどが要る）。小麦 3 つでパン（craft {item: bread}）
    食べ物は動物を狩る、畑で育てる、チェストから withdraw
  tools: [find_foods, eat, smelt, craft, withdraw]
  see: [hunt, smelt, harvest_crops]

- key: hunt
  title: 動物を狩る・増やす・毛を刈る
  words: hunt animals cow pig sheep chicken meat wool leather breed shears
  when: 肉・羊毛・革が要るとき
  how: |
    attack {entity}（近くのモブの id）で倒す。牛（肉と革）、豚、羊（肉と羊毛）、鶏（肉と羽根）
    羊毛だけ欲しいときはハサミ（鉄のインゴット 2 つ）で use_item {item: shears, entity} すると羊が残る
    増やす: 同じ種類の 2 匹に use_item で餌をやる（牛・羊は wheat、豚は carrot、鶏は wheat_seeds）
    前に見た動物の場所は search_memory（例: sheep、羊）
  tools: [attack, use_item, search_memory]
  see: [cook_food]

- key: survive_night
  title: 夜を越す
  words: night sleep bed dark monsters zombie skeleton shelter
  when: 夕方・夜になったとき
  how: |
    家があれば go_home で入ってドアを閉め、sleep で家のベッドで寝る（夜だけ）
    家から遠いときは、ベッドを持っていれば置いて寝る（小目標 through_night の提案 do_suggestion）か、地下にいる
    家の中なら敵は来ない。外に出るかは「外に出る危なさ」（体力・時間帯・近くの敵・装備・失うものから測る）を見て決める。極めて高いときだけ、外に出る道具が断られる（理由と、先にすること）。危なければ、先に持ち物をチェストに預ける・食べる・剣を持つ・家に戻る
    ベッドに村人などが寝ていると「the bed is occupied」で寝られない。夜、そばのベッドに寝ている村人がいれば「wake up the sleeping … (one hit)」が候補に出る（do_suggestion）。素手で 1 回殴って起こし、ベッドが空いたら寝る。attack は倒すまで戦うので使わない
    家もベッドもない夜（家がない・行けない・64 ブロックより遠い）は、平らな土の地面で「dig into the ground here and seal yourself in until morning」が候補に出る（do_suggestion）。足元に 3 マスの縦穴を掘って入り、上を掘った土で塞ぐ。朝まで「stay in the sealed hole until morning」で待つ。夜の外で立って待たない。朝になったら「climb out of the hole」で上がる。石や崖・水のそばでは出ない（理由は blocked に出る）
    縦穴が掘れない所（砂浜・石の上・水のそば）の家もベッドもない夜は、「wall yourself in with dirt here and wait until morning」が候補に出る（do_suggestion）。立った所の四方と真上を土・丸石・板で囲む（13 ブロックほど。持っていなければ近くの土を素手で掘って集める）。囲んだら「stay in the sealed hole until morning」で朝まで待ち、朝は「climb out of the hole」で壁の 1 方を掘って出る
    剣も斧もないなら、見えている木から剣を作る手（素手で原木を殴る）も候補に出る。夜に木を探して歩く手は出ない
    家のドアがなく、そのマスの床もないときは go_home は出ない（落ちる）。家の足元を埋める built() を先に選ぶ
    水の中にいるときは、まず陸へ泳ぐ（do_suggestion の「swim to the nearest land at …」。聞かずに実行される）。水の中では goto も explore も進まない
  tools: [go_home, sleep, do_suggestion]
  see: [fight]

- key: fight
  title: 敵と戦う・逃げる
  words: fight attack flee monster zombie skeleton creeper spider sword
  when: 敵が近くにいるとき
  how: |
    剣か斧を equip してから attack {entity}。体力が少ない・武器がないときは flee {entity}
    クリーパーは近づくと爆発する: 離れるか、離れた所から戦う
    近くの敵には反射（自動の戦う・逃げる）が先に動く
    武器がなくても、体力が 12 以上なら、ゾンビ・ドロウンド・クモ・スケルトンとは 1 体のときに素手で殴り合う（体力が 8 を切ったらやめて逃げる）。クリーパーとは戦わない。水の中では素手で戦わず、陸へ泳いで上がってから
  tools: [equip, attack, flee]
  see: [survive_night, upgrade_tools]

- key: cross_water
  title: ボートで水を渡る
  words: boat water river lake ocean cross sail row
  when: 長い水（川、湖、海）の向こうへ行くとき
  how: |
    ボートは同じ木の板材 5 枚で craft（作業台が要る。例: oak_boat）
    goto など遠くへ行く道具は、途中に長い水があれば、ボートを持っていれば自分で乗って渡る
    ride_boat {x, z} で水の上を進む（水際で置いて乗り、岸で降りて拾う）
  tools: [craft, goto, ride_boat]

- key: store_items
  title: チェストにしまう・出す
  words: chest store deposit withdraw storage inventory full
  when: 持ち物がいっぱいのとき、集めた物を蓄えるとき、しまった物が要るとき
  how: |
    deposit {item, count} で家のチェストに入れる（チェストがなければ板材 8 枚で craft して家の中に place）
    withdraw {item, count} で入っているチェストから出す
    作った物・集めた物は、使わないなら家に戻ったときにチェストへ（個数に関わらない。ダイヤ 1 個も）。家の中にいて、目標に要らない物
    （武器・防具・つるはし・食べ物・松明とその材料以外。種・クワ・バケツは目標が使うときだけ持つ）を持っていれば、提案に
    「put the things you do not need now in the home's chest」が出る（聞かずに実行される）。外でも、価値の高い物（ダイヤ・金・エメラルド
    など）を持っている・持ち物がほぼいっぱいのときは、家から遠くても一度戻って預ける。地下へ出る直前に家が近ければ先に預ける
    どのチェストに何があるかは search_memory（例: チェスト、wheat が入ったチェスト）
    預けるとき、最初のチェストがいっぱいなら次のチェストへ入れる。家のチェストの空きが少なくなると（総スロットの 2 割か 4 スロット以下）、
    placed(chest, home, 今の数 + 1) が小目標の候補に出る（上限は 6 ブロック。ラージチェストは 2）。家にチェストが 2 つ以上あって、同じ物が
    散らばっている・半端なスタックがあるときは、提案に「put the home's chests in order」が出る（家の中で。同じ物を 1 つのチェストに集め、
    半端なスタックを詰める。中身が変わるまで 2 回は出ない）
    持ち物がいっぱいで落とし物が拾えないとき、家のチェストが遠い・ないときは、toss で余った物を捨てて空ける
    （toss だけで余り全部。土と丸石は 64 個ずつ残す。道具、食料、松明、目標に要る物は捨てない。item は自然の地形、
    丸石、花、羊毛だけ）。捨てた物は拾う候補に出ない
  tools: [deposit, withdraw, toss, craft, place, search_memory]

- key: place_things
  title: 物を置く（松明、家具、ブロック）
  words: place put torch lantern furniture block wall floor
  when: 松明や家具を置く、足場や壁を作る、穴をふさぐとき
  how: |
    place {item, x,y,z, on?} で持っているブロックを空いたセルに置く（隣に面を借りるブロックが要る）
    松明・看板は on: wall で壁に。家の部屋の中にも何でも置ける（ドアのすぐ内側とベッドの場所は空ける）
    置いてある家具（ベッド・作業台・かまど・チェスト）は move_furniture で動かす
  tools: [place, move_furniture]
  see: [light_up]

- key: demolish
  title: 家や建物を壊す・置いてある家具を拾う
  words: demolish break remove tear wall house build take furniture pick up crafting table furnace chest bed
  when: 家や建てた物を壊すこと自体が目的のとき、置いてある作業台・かまど・チェスト・ベッドを持っていきたいとき
  how: |
    家・建てている家・建物は、ふつうは dig が断る。壊すのが目的のときだけ dig {x,y,z, demolish: true}
    近くに置いてある作業台・かまど・チェスト・ベッドは、have(その物) で作らず拾う手が出る（家の家具は家の中でだけ move_furniture）
    中身のあるチェストは先に withdraw で出す
    place・use_item・move_furniture も、保護された所へ承知で置く・使う・動かすときは override: true（普段は断られる）
    名前付きの建物を壊して作り直すときは、先に build_next {name, reset: true}: 底面（建物の外には触らない）の建物のブロックを保護も含めてすべて壊して地面にそろえ、置いた記録を捨てる。そのあと build_next が最初のブロックから置く。壊した跡の上に作り直さない（跡と新しい壁が混ざる）
    建物の中のセルへ着けないとき（壁が閉じている）は、ドアを置く・壁の1マスを dig {demolish: true} で開ける、または reset で更地にして最初から
    引っ越しで残した前の家（半壊・廃屋）は clear_old_home（一番近い前の家）: 壁・屋根・床・家具を壊して地面にそろえ、前の家の記録から外す。中身のあるチェストは先に withdraw で出す。住んでいる家は対象外
  tools: [dig, move_furniture, withdraw, build_next, clear_old_home]
  see: [place_things]

- key: after_death
  title: 死んだあと、落とした持ち物を取り戻す
  words: death died respawn dropped items lost inventory recover
  when: 死んで生き返った直後（持ち物が空になったとき）
  how: |
    死んで落とした持ち物は 5 分で消える。死んで 4 分半までは、死んだ場所へ戻る手（recover your things where you died）が候補に出て、次の小目標を決める前に、聞かずに選ばれる
    散らばった物は pickup でも拾える
  tools: [pickup]
  see: []

- key: keep_water_in
  title: 水をせき止めているブロックを壊さない・流れ出た水を埋める
  words: water leak flood farm log village edge hole plug dig demolish lava tree
  when: 原木や土を掘るとき、畑や池のそばで掘ったあと、水が流れ出ているとき
  how: |
    水や溶岩に接した（横か上）固いブロックは掘れない（dig は断り、demolish でも同じ。壊すと流れ出す）。別の場所から取る
    原木は木の幹だけを集める。find_blocks の tree: false は村の畑の縁や家の柱で、集めない。自分で置いた原木（placed_by_me: true）は片付けてよい
    掘った跡に水が入り込んだら（10 分以内）、埋める手（plug the hole at …）が候補に出て、聞かずに選ばれる。同じ物か土・丸石で埋める
  tools: [dig, find_blocks, place]
  see: [find_things]

- key: light_up
  title: 明るくする・湧き潰し
  words: light torch dark spawn mobs lit lighting
  when: 家のまわりに敵が湧くとき、暗い所をなくしたいとき
  how: |
    松明は石炭（か木炭）1 つと棒 1 本で 4 本（craft {item: torch}）
    松明は 4 本を切らさず持つ。暗くて持っていなければ、何も見えないので引き返して作る
    あるマスの明るさは、inspect {x,y,z} の light（松明などのブロックの光 0〜15）と sky_light（空の光）で見える。
    light が 0 ならモブが湧く。2 未満は暗すぎるとして松明を足す（置いたマスで 14、1 ブロックごとに 1 下がる）。null は届いていない
    持つ量は生活インフラの段階で変わる（設定 minecraft.supplies）: 序盤は 16 本まで、畑ができたら 16 本（備蓄 32）、採掘の段階では 1 スタック（64 本）を手に持つ。
    手持ちと家のチェストの合計で数え、家の中ではチェストから手に取る。食べ物も同じ（満腹度で数える。序盤は 24 点まで）
    洞窟の中では石炭や棒が集まらないことが多い。地下で松明が 4 本より少なく、作る材料もなければ、集めずに地上へ出る（提案の「get out to the surface」、または家へ帰る）。家のチェストの松明や材料はそこで使う
    暗い所か深い地下で 4 本未満のとき、材料（石炭か木炭と棒）があれば、提案に craft torch が出る。needs に
    「only N torches left」と出たら、置き切る前に作り足す
    place {item: torch, x,y,z} で暗い地面に置く。完了条件 lit(distance) はブリッジが暗い所を数える
  tools: [craft, place]
  see: [place_things]

- key: town_roads
  title: 街の道を敷く
  words: road path street town lay dirt_path shovel avenue
  when: 街の理想図に道（=）があって、まだ敷いていないとき。建物を増やす前に道を通したいとき
  how: |
    道は理想図でコードが先に決めてある（家から東西南北の大通りと、施設への枝）。施設は道に面した区画に作る
    敷くのは、石以上のシャベル（have(stone_shovel)）を持ったときに出る候補「lay the dirt path of the town's roads」
    （do_suggestion）。近い順に、草や土をシャベルで土の道にする。水・木・家・畑の上は敷かない
  tools: [do_suggestion]
  see: [level_ground]

- key: level_ground
  title: 整地する
  words: level flatten ground terrain dig fill
  when: 建物や畑の場所の地面をそろえたいとき
  how: |
    level {where, radius} で where（home か x,y,z）のまわりを 1 つの高さにそろえる。y は立つ足の高さ（地面はその 1 つ下）。
    設計した畑の上は、畑の地面より 1 つ上の y でなければ断られる（畑は自分で整地する）
    出っ張ったブロックは、土や石も木も置いた物（板・原木・チェストなど）も全部掘り、穴を土で埋める。
    家・建物・植えた木・畑・水・採掘場は触らない。保護された家・建物、植えた木、畑が建てる所を塞いでいて、壊してでも
    そろえるなら level {where, radius, demolish: true}（目標なら leveled(where, 半径, demolish: true)）。
    水・採掘場・壊せないブロックは残る。家や建物を壊すと、記録は残るので、まだ要るなら built(...) で建て直す
    穴だけ残ったときは、穴の数だけ土を持ってから呼ぶ（足りないと断られる）。土は整地する土地の外から取る:
    その土地の床より下の地面は、dig でも断られる（掘ると、そろえた地面の下が穴だらけになる）
  tools: [level, dig]

- key: build
  title: 建物を建てる
  words: build house building construct shed tower wall blueprint
  when: 家や名前付きの建物（倉庫、塔、壁）を建てるとき
  how: |
    build_next {name, count} で設計図の次のブロックから続けて置く（省くと材料が尽きるか止められるまで、最大 60 個。name を省くと今の目標の建物か家）
    材料（板材、原木、丸石、土）を先に集めておく。建てている建物の場所は search_facility
  tools: [build_next, search_facility]

- key: craft
  title: クラフトする
  words: craft make recipe crafting table tools items
  when: 道具・家具・材料を作るとき
  how: |
    craft {item, times} で作る。作業台が要るレシピは 32m 以内の作業台まで歩く（遠ければ板材 4 枚で作業台を作って置くほうが早い）
    材料は recipe_of {item}、名前が分からなければ item_info {query}、手持ちで作れる物は uses_of {item, have: true}
  tools: [craft, recipe_of, item_info, uses_of]
  see: [upgrade_tools]

- key: upgrade_tools
  title: 道具を作り直す・良い道具にする
  words: tools pickaxe axe shovel sword hoe upgrade broken durability stone iron diamond
  when: 道具が壊れたとき、もっと硬い物を掘りたいとき
  how: |
    格は木 → 石 → 鉄 → ダイヤ。材料は板材 / 丸石 / 鉄のインゴット / ダイヤ と棒
    例: stone_pickaxe は丸石 3 と棒 2（作業台）。壊れた道具は「壊れた道具」に出る
    craft {item} で作る。何が要るかは recipe_of {item}
  tools: [craft, recipe_of]
  see: [mine_ores, craft]

- key: find_things
  title: 物や場所を探す
  words: find search look where explore gather locate
  when: 要る物が手元にないとき
  how: |
    1. 「目の前のブロック」「目の前に落ちている物」を見る（pickup で拾う）
    2. find_blocks {block} で近く（最大 64m）を探す
    3. search_memory {query} で前に見た場所、search_facility {query} で自分の施設
    4. item_info {query} でどこで取れるか（どのブロック・モブ・レシピ）を調べる
    5. それでもなければ、ソルバーの提案の探索（do_suggestion の explore …）で遠くへ
  tools: [pickup, find_blocks, search_memory, search_facility, item_info, do_suggestion]

- key: use_items
  title: アイテムを使う（右クリック）
  words: use item bucket water bone_meal shears lead strip fishing
  when: バケツで水を汲む・注ぐ、骨粉で育てる、ハサミで毛を刈る、斧で皮をはぐ、釣りをするとき
  how: |
    use_item {item, entity?} でそのモブに（餌、ハサミ、リード）、use_item {item, x,y,z} でそのブロックに（骨粉、バケツ、斧）
    どちらもなければ向いている方へ（雪玉、釣り竿）。食べ物は eat、ボートは ride_boat、チェストは deposit / withdraw
  tools: [use_item, eat, ride_boat, deposit, withdraw]
  see: [water_farm, experiment]

- key: experiment
  title: 原因が分からない失敗を実験で調べる
  words: experiment stuck door inspect diagnostics sneak face trial error repeat
  when: 同じ理由で失敗し続けるとき、ドアが開かない・閉まらない、置けない、歩けない、理由を読んでも直し方が分からないとき
  how: |
    失敗が続くと（2 回続けて失敗、同じ理由が 3 回、状況が動かない）、道具に inspect と diagnostics が加わり、use_item が拡張される
    0. 家に入れない・歩けないときは、まず inspect（座標なし）で自分を見る: closed_space（歩いて出られない閉じた所か）と home_door
       （ドアまで何ブロック離れ、何ブロック下か）。ドアから遠ければ、ドアを調べても意味がない（ドアの前に立っていない）
    1. diagnostics {kind: door|place|boat|stuck} でブリッジが残した失敗の記録を読む。inspect {x,y,z} でそのマス（ブロックの状態 props、
       6 方向の隣、届くか、間にある物、断られる理由）を、inspect（座標なし）で自分（スニーク・手の物・視線の先）を見る
    2. 仮説を 1 つ立て、変えるものを 1 つだけ変えて試す: use_item {x,y,z, face: up|down|north|south|east|west, sneak: true|false}
       item を省くと素手で押す（ドア・レバー・ボタン）。家のドアは座標の代わりに target: home_door
    3. もう一度 inspect で変わったかを確かめる。変われば続ける（うまくいった座標なしの手は覚えた候補になる）。変わらなければ別の 1 つを変える
    4. 3 つ試して通らなければ別の手（家に戻る・小目標を変える）へ
    間にある物（in_the_way）には、小麦・草・苗木・松明のように通り抜けられる物も含まれる（サーバーのレイはその枠に当たる）。
    バケツや置く手が効かなかったときの文に「the wheat at … is in the line」とあれば、書かれた横のマスに立ってもう一度使う
  tools: [inspect, diagnostics, use_item]
  see: [use_items]

- key: skills
  title: 技を使う・覚える
  words: skill script routine repeat automate
  when: 同じ道具の並びを何度も呼んでいるとき
  how: |
    run_skill {name} で覚えた技を実行する（合う技があれば道具を 1 つずつ呼ぶより先に）
    write_skill {name, what} で新しい技を書く（すぐ 1 回試す）。失敗したら先に原因を調べ（記録の失敗した道具とその文）、同じ名前で直す（原因を書き、コードを変える）
    till → sow のような同じ手の並びを 3 回続けて成功させると、「同じ手の並びを繰り返している」と出る。技にするかは自分で決める
    1 回の実行は行動 40 回まで（超えると失敗）。長い作業は、36 回ほどで切り上げる技にして、もう一度呼んで続ける
  tools: [run_skill, write_skill]

- key: collect_on_the_way
  title: 探索中に見つけた鉱石や素材を、目標外でも集める
  words: ore coal iron copper gold diamond emerald lapis redstone obsidian clay sugar_cane collect windfall pickaxe tier 鉱石 ついで 黒曜石
  when: 探索中・移動中に、目標に関係ない鉱石や素材が近くに見えたとき。ダイヤや黒曜石を見つけたが、掘れないとき
  how: |
    近く（12 m 以内）にある鉱石（石炭・銅・鉄・ラピス・レッドストーン・金・ダイヤ・エメラルド）と、設定の一覧
    （黒曜石・粘土・サトウキビなど）は、掘れる道具があり安全なら、ブリッジが候補に出し、聞かずに掘る
    （do_suggestion「collect <block> at x,y,z」。自分で掘るなら dig {x,y,z}）。持っている数が 1 スタックに届いたものは掘らない（目的外の素材は 1 スタックまで）
    家に帰る・夜を越す・戦う小目標の間と、武器なしの地下では出ない。聞かずに掘るのは、その小目標の目標の手と同じ数まで（寄り道ばかりにならない）
    掘れるかはツルハシの階級で決まる: 石炭・銅・鉄・ラピスは石以上、金・ダイヤ・エメラルド・レッドストーンは鉄以上、
    黒曜石はダイヤ。掘れない物は掘らず、場所は地図が覚えている。道具を作ったあと、12〜48 m 先の覚えている場所には
    「go to the <block> seen at x,y,z and mine it」の候補が出る（地下へは松明が足りるときだけ）
    ダイヤを見つけたら、鉄のツルハシを作る理由になる（craft {item: iron_pickaxe}）。離れた場所へは goto
  tools: [do_suggestion, dig, goto, craft]
  see: [make_farm]

- key: climb_down
  title: 崖の上（柱の頂上・建物の屋根）から降りる（積んだ列を掘り戻す・縁から飛び降りる）
  words: climb down step off pillar tower roof top stuck high dig down drop cliff tall fall damage edge
  when: 高い柱・塔・建物の屋根の上にいて、まわりが崖で歩いて降りられない。climb_out を繰り返しても出られない（積むほど高くなる）
  how: |
    まわりが崖で（3 ブロックより下まで床がない）足元が 1 本の柱か、自分が climb_out で積んだ列なら、候補 `climb down the pillar you stand on by digging it away`
    が出る（do_suggestion で実行する。昼は聞かずに実行される）。足元のブロックを 1 つずつ掘って落ち、歩いて降りられる高さになったら止まる。
    掘ったブロックは拾えるので、降りるほど土や丸石が戻る。道具はいらない（素手でも壊せる）。建物の屋根に開けた穴に積んだ列でも、来た道だけを戻る（建物は掘らない）
    縁から飛び降りてよい高さなら、候補 `step off the edge and drop N blocks to x,y,z (D damage, health H)` も出る: 落下ダメージは落差から 3 を引いた分で、
    降りたあとに体力が 6 以上残る縁だけ出る（水に降りるならダメージなし）。体力が足りないときは、食べるか休んでから、または掘り戻す
    - 柱でも自分が積んだ列でもない所（自然の崖の縁、建物）は掘らない。積んで出る climb_out は崖の上では出ない（閉じた所ではないため）
    - 積んで上がった先が、屋根・柱の頂上（四方が崖）に出るだけなら、climb_out は出ず、横の壁を掘る dig_out が出る
    - inspect（座標なし）の over_a_drop で、崖の上かどうかが分かる
  tools: [do_suggestion, inspect]
  see: [climb_out]

- key: climb_out
  title: 閉じた所（出られない穴）から、土か丸石を積んで、または壁を掘って出る
  words: climb out closed space stuck pocket trapped shut pile pillar tower dirt cobblestone stairs shaft hole pickaxe broke
  when: go_home や goto が「No path」「closed space」で失敗する、深い穴・採掘場の底・岩に囲まれた所から出られない、ツルハシが壊れて石を掘れない
  how: |
    歩いて出られない閉じた所にいて、土か丸石を持っていれば、候補 `climb out of the closed space by piling up dirt or cobblestone` が出る
    （do_suggestion で実行する。昼は聞かずに実行される）。足元に積んで、歩いて出られる高さまで上がる。頭の上が岩なら素手でも掘る（閉じ込められたときだけ）
    - 積むものがなければ（素手の始まり）、積んで上がった先が屋根・柱の頂上に出るだけのとき、上が保護された建物で横に出る道があるとき、候補 `dig out of the closed space through the wall` が出る: 掘る数がいちばん少ない壁を素手でも掘って、歩いて出る（水が入った小部屋では、夜も聞かずに実行される）。溶岩に接する壁、池や海を止める壁は掘らない。家・建物の壁は、ほかに出る道がないときだけ、`... through the wall of a home or build (takes part of it down)` の名前で出る（聞かずには実行されない）
    - 出たら go_home や surface で戻る。ツルハシが壊れていたら、家に戻って作る（候補 `go home to make a new pickaxe`）
    - ドアの前でなければ、ドアは原因ではない: inspect（座標なし）の closed_space と home_door で確かめる
    - 水が入った小部屋（空気が数マスの水たまり）でも出る。水の中では夜も聞かずに実行される。reflex_surface という skill はない（息の反射はブリッジが自分でやる）
  tools: [do_suggestion, inspect]
  see: [experiment]
