<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<!--
  配信者のアバター（VRM）。OBS のブラウザソース用（1920x1080、背景は透明）。
  /api/avatar/stream の合図（話す・話し終わる・表情・しぐさ）で動く（avatar.py）。

  クエリ:
    ?demo=1        サーバーの合図なしで、話す・表情・しぐさを順に見せる（見た目の調整用）
    ?view=full     全身（既定は bust: 胸から上）
    ?pos=left      画面の左に寄せる（既定は right。center もある）
    ?scale=1.2     大きさ（カメラの寄り）
    ?model=URL     別の VRM を読む（既定は /assets/avatar.vrm）
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
  #error { position: absolute; left: 12px; bottom: 12px; font: 14px sans-serif; color: #fff; background: rgba(160, 0, 40, .8); padding: 6px 10px; border-radius: 6px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/",
    "@pixiv/three-vrm": "/vendor/three-vrm/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm'

const params = new URLSearchParams(location.search)
const VIEW = params.get('view') === 'full' ? 'full' : 'bust'
const POS = ['left', 'center', 'right'].includes(params.get('pos')) ? params.get('pos') : 'right'
const ZOOM = Number(params.get('scale')) || 1

function showError (message) {
  const e = document.createElement('div')
  e.id = 'error'
  e.textContent = `アバター: ${message}`
  document.body.append(e)
}

// ---------------------------------------------------------------- 描画の準備
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false })
renderer.setClearColor(0x000000, 0)
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.append(renderer.domElement)

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(VIEW === 'full' ? 30 : 22, window.innerWidth / window.innerHeight, 0.1, 20)
camera.zoom = ZOOM
const light = new THREE.DirectionalLight(0xffffff, 2.4)
light.position.set(0.4, 1.2, 2).normalize()
scene.add(light, new THREE.AmbientLight(0xffffff, 0.25))
const lookTarget = new THREE.Object3D() // 目線の先（ほとんどはカメラ、ときどきよそ見）
scene.add(lookTarget)

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  frame()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

// ---------------------------------------------------------------- モデル
let vrm = null
let hipsY = 0 // 立ち姿の腰の高さ（跳ねるしぐさはこれに足す）
const bones = {}
const rest = {} // 立ち姿の回転（しぐさはこれに足す）

const loader = new GLTFLoader()
loader.register((parser) => new VRMLoaderPlugin(parser))
loader.load(params.get('model') || '/assets/avatar.vrm', (gltf) => {
  vrm = gltf.userData.vrm
  if (!vrm) return showError('VRM ではないファイル')
  VRMUtils.removeUnnecessaryVertices(gltf.scene)
  if (VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(gltf.scene)
  vrm.scene.traverse((o) => { o.frustumCulled = false })
  scene.add(vrm.scene)
  for (const name of ['hips', 'spine', 'chest', 'upperChest', 'neck', 'head', 'leftUpperArm', 'rightUpperArm',
    'leftLowerArm', 'rightLowerArm', 'leftHand', 'rightHand', 'leftShoulder', 'rightShoulder']) {
    bones[name] = vrm.humanoid.getNormalizedBoneNode(name)
  }
  // T ポーズから、腕を下ろして少しひじを曲げた立ち姿へ
  setRest('leftUpperArm', 0, 0, -1.3)
  setRest('rightUpperArm', 0, 0, 1.3)
  setRest('leftLowerArm', 0, -0.25, -0.1)
  setRest('rightLowerArm', 0, 0.25, 0.1)
  setRest('leftHand', 0, 0, -0.1)
  setRest('rightHand', 0, 0, 0.1)
  if (vrm.lookAt) vrm.lookAt.target = lookTarget
  hipsY = bones.hips.position.y
  frame()
  startCues()
}, undefined, (error) => showError(`モデルを読めない（${error.message ?? error}）`))

function setRest (name, x, y, z) {
  if (!bones[name]) return
  rest[name] = new THREE.Euler(x, y, z)
  bones[name].rotation.copy(rest[name])
}

// カメラの位置: 顔（胸から上）か全身。pos で左右に寄せる
function frame () {
  if (!vrm) return
  const head = new THREE.Vector3()
  bones.head.getWorldPosition(head)
  const hips = new THREE.Vector3()
  bones.hips.getWorldPosition(hips)
  // bust: 画面の下 2/3 ほどに、頭から腰の上まで。full: 頭から足まで
  const aim = VIEW === 'full' ? new THREE.Vector3(0, (head.y + 0.1) / 2, 0) : new THREE.Vector3(0, head.y - 0.2, 0)
  const distance = VIEW === 'full' ? (head.y + 0.25) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.1 : 2.2
  const halfWidth = distance * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect / camera.zoom
  const shift = POS === 'center' ? 0 : (POS === 'left' ? 1 : -1) * halfWidth * 0.62
  camera.position.set(aim.x + shift, aim.y, distance)
  camera.lookAt(aim.x + shift, aim.y, 0)
  camera.updateProjectionMatrix()
  lookTarget.position.copy(camera.position)
}

// ---------------------------------------------------------------- 表情
// ドメインの感情 → VRM の表情（重み）
const EMOTIONS = {
  happy: { happy: 1 },
  excited: { happy: 1, surprised: 0.2 },
  sad: { sad: 1 },
  angry: { angry: 1 },
  surprised: { surprised: 1 },
  scared: { surprised: 0.6, sad: 0.4 },
  relaxed: { relaxed: 1 }
}
const FACES = ['happy', 'angry', 'sad', 'relaxed', 'surprised']
const face = Object.fromEntries(FACES.map((f) => [f, 0])) // 今の重み
let faceTarget = {}
let faceUntil = 0

function setEmotion (emotion, intensity = 0.8, seconds = 3) {
  const weights = EMOTIONS[emotion]
  if (!weights) return
  faceTarget = Object.fromEntries(Object.entries(weights).map(([k, v]) => [k, v * intensity]))
  faceUntil = now() + seconds
}

// ---------------------------------------------------------------- 口（本文から母音を並べる）
const VOWEL = {}
const rows = { aa: 'あかさたなはまやらわがざだばぱぁゃゎ', ih: 'いきしちにひみりぎじぢびぴぃ', ou: 'うくすつぬふむゆるぐずづぶぷぅゅゔ', ee: 'えけせてねへめれげぜでべぺぇ', oh: 'おこそとのほもよろをごぞどぼぽぉょ' }
for (const [v, chars] of Object.entries(rows)) {
  for (const c of chars) {
    VOWEL[c] = v
    VOWEL[String.fromCharCode(c.charCodeAt(0) + 0x60)] = v // カタカナ
  }
}
const OPEN = ['aa', 'oh', 'ih', 'ee', 'ou']
const SMALL = new Set('ゃゅょぁぃぅぇぉャュョァィゥェォ')
const PAUSE = /[、。，．,.!！?？…\s「」『』（）()]/

// 本文 → [{viseme, weight}]（1 つがおよそ 1 モーラ）
function visemes (text) {
  const out = []
  for (const c of text) {
    if (PAUSE.test(c)) { out.push({ v: null, w: 0 }, { v: null, w: 0 }); continue }
    if (c === 'ー' || c === '〜') { if (out.length) out.push({ ...out[out.length - 1] }); continue }
    if (c === 'っ' || c === 'ッ') { out.push({ v: null, w: 0 }); continue }
    if (c === 'ん' || c === 'ン') { out.push({ v: 'ou', w: 0.25 }); continue }
    if (SMALL.has(c) && out.length) { out[out.length - 1] = { v: VOWEL[c], w: 0.9 }; continue }
    if (VOWEL[c]) { out.push({ v: VOWEL[c], w: 0.9 }); continue }
    // 漢字や英数字: 読みが分からないので、字ごとに決まった 2 モーラ
    const code = c.codePointAt(0)
    const n = /[一-鿿]/.test(c) ? 2 : 1
    for (let i = 0; i < n; i++) out.push({ v: OPEN[(code + i * 3) % OPEN.length], w: 0.75 })
  }
  return out
}

let speech = null // { seq, start, per, end }
const mouth = Object.fromEntries(OPEN.map((v) => [v, 0]))

function speak (text, durationMs, emotion) {
  const seq = visemes(text)
  if (!seq.length) return
  const per = Math.min(0.22, Math.max(0.07, durationMs / 1000 / seq.length))
  speech = { seq, start: now(), per, end: now() + Math.max(durationMs / 1000, per * seq.length) }
  if (emotion) setEmotion(emotion, 0.7, Math.max(2.5, durationMs / 1000))
}
function quiet () { if (speech) speech.end = Math.min(speech.end, now() + 0.1) }

// ---------------------------------------------------------------- しぐさ
let gesture = null // { name, start, length }
const LENGTH = { nod: 0.9, cheer: 1.6, flinch: 0.7, tilt: 1.8, wave: 2.2 }
function play (name) { if (LENGTH[name]) gesture = { name, start: now(), length: LENGTH[name] } }

// ---------------------------------------------------------------- 毎フレーム
const timer = new THREE.Timer()
const now = () => timer.getElapsed()
let nextBlink = 2
let blinkStart = -1
let nextGlance = 4
const glance = new THREE.Vector3()

function update (dt) {
  const t = now()
  // 毎フレーム立ち姿に戻してから、息・揺れ・しぐさを足す
  for (const [name, b] of Object.entries(bones)) if (b) b.rotation.copy(rest[name] ?? ZERO)
  bones.hips.position.y = hipsY
  // 息と揺れ
  const breath = Math.sin(t * 1.7)
  add('spine', 0.012 * breath, 0, 0.012 * Math.sin(t * 0.6 + 1))
  add('chest', 0.01 * breath, 0.02 * Math.sin(t * 0.45), 0)
  add('hips', 0, 0.015 * Math.sin(t * 0.3), 0.012 * Math.sin(t * 0.6))
  add('neck', 0.02 * Math.sin(t * 0.5), 0.05 * Math.sin(t * 0.37), 0.02 * Math.sin(t * 0.43 + 2))
  add('leftUpperArm', 0, 0, 0.03 * breath)
  add('rightUpperArm', 0, 0, -0.03 * breath)
  // 話しているときは頭を少し動かす
  const talking = speech && t < speech.end
  if (talking) add('head', 0.04 * Math.sin(t * 5.3), 0.03 * Math.sin(t * 3.1), 0.03 * Math.sin(t * 2.3))

  // しぐさ
  if (gesture) {
    const p = (t - gesture.start) / gesture.length
    if (p >= 1) gesture = null
    else {
      const s = Math.sin(Math.PI * p)
      if (gesture.name === 'nod') add('head', 0.22 * Math.abs(Math.sin(2 * Math.PI * p)), 0, 0)
      if (gesture.name === 'flinch') { add('head', -0.2 * s, 0, 0); add('spine', -0.08 * s, 0, 0) }
      if (gesture.name === 'tilt') { add('head', 0.04 * s, 0.05 * s, 0.3 * s); add('neck', 0, 0, 0.12 * s) }
      if (gesture.name === 'wave') {
        // 右手を上げて振る（ひじから先を左右に）
        // 上腕をほぼ水平に上げ、ひじから先を立てて左右に振る
        const swing = 0.35 * Math.sin(2 * Math.PI * 3 * p)
        add('rightUpperArm', 0, 0.3 * s, -1.5 * s); add('rightLowerArm', 0, 0, (-1.6 + swing) * s)
        add('head', 0, 0, -0.08 * s)
      }
      if (gesture.name === 'cheer') {
        add('leftUpperArm', 0, 0, 2.0 * s); add('rightUpperArm', 0, 0, -2.0 * s)
        add('leftLowerArm', 0, 0, 0.6 * s); add('rightLowerArm', 0, 0, -0.6 * s)
        bones.hips.position.y = hipsY + 0.04 * Math.abs(Math.sin(3 * Math.PI * p))
        add('head', -0.1 * s, 0, 0)
      }
    }
  }

  // 表情: 目標へなめらかに、時間が過ぎたら戻す
  if (t > faceUntil) faceTarget = {}
  for (const f of FACES) {
    face[f] += ((faceTarget[f] ?? 0) - face[f]) * Math.min(1, dt * 6)
    vrm.expressionManager.setValue(f, face[f])
  }
  // まばたき（笑顔のときは目がもう細いので弱める）
  if (t > nextBlink) { blinkStart = t; nextBlink = t + 2.2 + Math.random() * 4 }
  const bp = (t - blinkStart) / 0.16
  const blink = bp >= 0 && bp <= 1 ? Math.sin(Math.PI * bp) : 0
  vrm.expressionManager.setValue('blink', blink * (1 - 0.8 * face.happy))
  // 口
  const target = Object.fromEntries(OPEN.map((v) => [v, 0]))
  if (talking) {
    const k = (t - speech.start) / speech.per
    const i = Math.floor(k)
    const cur = speech.seq[i]
    if (cur && cur.v) target[cur.v] = cur.w * (0.55 + 0.45 * Math.sin(Math.PI * (k - i)))
  } else if (speech && t >= speech.end) speech = null
  for (const v of OPEN) {
    mouth[v] += (target[v] - mouth[v]) * Math.min(1, dt * 18)
    vrm.expressionManager.setValue(v, mouth[v] * (1 - 0.5 * face.happy))
  }
  // 目線: ほとんどはカメラ、ときどき少しよそを見る
  if (t > nextGlance) {
    const away = Math.random() < 0.35
    glance.set(away ? (Math.random() - 0.5) * 0.6 : 0, away ? (Math.random() - 0.3) * 0.3 : 0, 0)
    nextGlance = t + (away ? 0.8 + Math.random() : 2.5 + Math.random() * 4)
  }
  lookTarget.position.lerp(camera.position.clone().add(glance), Math.min(1, dt * 4))
  vrm.update(dt)
}

const ZERO = new THREE.Euler()
// このフレームの回転に足す
function add (name, x, y, z) {
  const b = bones[name]
  if (!b) return
  b.rotation.set(b.rotation.x + x, b.rotation.y + y, b.rotation.z + z)
}

// デバッグ用（ブラウザのコンソールから）: avatarCue({type: 'emote', emotion: 'happy'}) など
window.avatarCue = (cue) => onCue(cue)
window.avatarDebug = () => ({ gesture: gesture && gesture.name, arm: vrm ? bones.rightUpperArm.rotation.z : null, loaded: !!vrm, camera: camera.position.toArray(), head: vrm ? bones.head.getWorldPosition(new THREE.Vector3()).toArray() : null })

renderer.setAnimationLoop((time) => {
  timer.update(time)
  const dt = Math.min(timer.getDelta(), 0.1)
  if (vrm) update(dt)
  renderer.render(scene, camera)
})

// ---------------------------------------------------------------- 合図
function onCue (cue) {
  if (cue.type === 'speak') speak(cue.text, cue.duration_ms, cue.emotion)
  else if (cue.type === 'quiet') quiet()
  else if (cue.type === 'emote') { if (cue.emotion) setEmotion(cue.emotion, cue.intensity, cue.seconds); if (cue.gesture) play(cue.gesture) }
  else if (cue.type === 'gesture') play(cue.gesture)
}

function startCues () {
  if (params.get('demo') === '1') return demo()
  const source = new EventSource('/api/avatar/stream') // 切れても自分でつなぎ直す
  source.onmessage = (e) => onCue(JSON.parse(e.data))
}

// 見本: 話す・表情・しぐさを順に繰り返す
function demo () {
  const script = [
    { type: 'speak', text: 'こんにちは！シェンだよ。今日も街づくり、がんばるね！', duration_ms: 3600, emotion: 'happy' },
    { type: 'gesture', gesture: 'wave' },
    { type: 'speak', text: 'うわっ、ゾンビだ！家に戻らなきゃ。', duration_ms: 2600, emotion: 'surprised' },
    { type: 'emote', emotion: 'surprised', intensity: 0.9, seconds: 1.8, gesture: 'flinch' },
    { type: 'emote', emotion: 'happy', intensity: 1, seconds: 4, gesture: 'cheer' },
    { type: 'speak', text: 'やった、家がかんせいしたよ！みんなありがとう！', duration_ms: 3400, emotion: 'happy' },
    { type: 'speak', text: 'うう、羊が見つからない…ざんねん。', duration_ms: 2800, emotion: 'sad' },
    { type: 'emote', emotion: null, intensity: 0.7, seconds: 2, gesture: 'tilt' }
  ]
  let i = 0
  const next = () => { onCue(script[i]); i = (i + 1) % script.length; setTimeout(next, 3800) }
  setTimeout(next, 800)
}
</script>
</body>
</html>
