<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Goals</title>
<!--
  配信向けの目標のオーバーレイ（OBS のブラウザソース、1920x1080、背景は透明）。
  目標ボード（goal_board.py）の /api/goals/stream を読み、目標が変わるたびに書き換える。

  クエリ:
    ?demo=1          サーバーなしで見本を出す（見た目の調整用。数秒ごとに目標が変わる）
    ?pos=right       右上に出す（既定は左上）
    ?theme=mint      色: pink（既定）/ mint / sky / lemon
    ?scale=0.8       大きさ
    ?compact=1       最終目標・今の大目標・小目標だけ（次の大目標、終わった大目標、中目標のカード、理由を出さない）
    ?toast=0         大目標クリア・技を覚えたなどのお知らせ（画面の真ん中に 4 秒）を出さない
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff5f9e;      /* リボン、今の大目標、進み具合 */
    --accent-soft: #ffd3e4;
    --accent-deep: #d63b7b;
    --ink: #4b3052;         /* 文字 */
    --ink-soft: #8a6f91;
    --panel: rgba(255, 255, 255, 0.9);
    --done: #3cc48b;
    --scale: 1;
  }
  .theme-mint  { --accent: #20c1a1; --accent-soft: #c6f3e9; --accent-deep: #11917a; --ink: #24424a; --ink-soft: #5f8189; }
  .theme-sky   { --accent: #4a9dff; --accent-soft: #d3e6ff; --accent-deep: #2a73d0; --ink: #273a57; --ink-soft: #62789a; }
  .theme-lemon { --accent: #f2a900; --accent-soft: #ffeebd; --accent-deep: #c07f00; --ink: #4a3b1c; --ink-soft: #8b7a55; }

  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif; color: var(--ink); }

  #stage {
    position: absolute; top: 28px; left: 28px; width: 540px;
    display: flex; flex-direction: column; gap: 14px;
    transform: scale(var(--scale)); transform-origin: top left;
    transition: opacity .4s;
  }
  #stage.pos-right { left: auto; right: 28px; transform-origin: top right; }
  #stage.hidden { opacity: 0; }

  .card {
    position: relative; background: var(--panel); border-radius: 22px;
    padding: 30px 22px 16px; border: 3px solid #fff;
    box-shadow: 0 6px 0 var(--accent-soft), 0 10px 26px rgba(40, 20, 50, .28);
  }
  /* 角のきらきら */
  .card::after {
    content: "✦"; position: absolute; top: 10px; right: 16px; font-size: 18px; color: var(--accent);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  .ribbon {
    position: absolute; top: -14px; left: 18px; padding: 4px 16px 5px 14px;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 17px; letter-spacing: .08em;
    border-radius: 999px; box-shadow: 0 3px 0 var(--accent-deep);
  }
  .ribbon .icon { margin-right: 6px; }

  .mission-text { font-size: 25px; font-weight: 800; line-height: 1.35; }
  .town {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 4px 12px;
    background: var(--accent-soft); border-radius: 999px; font-size: 16px; font-weight: 700;
  }
  .town .step { color: var(--accent-deep); }

  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { position: relative; padding: 8px 12px 8px 40px; border-radius: 14px; font-size: 19px; font-weight: 700; line-height: 1.35; }
  li::before { position: absolute; left: 12px; top: 8px; font-size: 19px; }
  li.current { background: linear-gradient(90deg, var(--accent-soft), rgba(255,255,255,0)); }
  li.current::before { content: "★"; color: var(--accent); animation: bob 1.6s ease-in-out infinite; }
  li.pending { color: var(--ink-soft); font-size: 17px; font-weight: 500; }
  li.pending::before { content: "・"; color: var(--ink-soft); }
  li.done { color: var(--done); font-size: 16px; font-weight: 500; }
  li.done::before { content: "✓"; color: var(--done); font-weight: 800; }
  .req {
    display: inline-block; margin-left: 6px; padding: 1px 9px; border-radius: 999px; vertical-align: 2px;
    background: #fff; border: 2px solid var(--accent-soft); color: var(--accent-deep); font-size: 13px; font-weight: 700;
  }
  .sub { font-size: 14px; font-weight: 500; color: var(--ink-soft); margin-top: 2px; }
  /* 中目標: 今の大目標の作業単位。済んだ数、今のもの、待っているもの */
  #job-card ol { gap: 4px; }
  #job-card li { padding: 5px 12px 5px 34px; font-size: 18px; }
  #job-card li::before { left: 10px; top: 5px; font-size: 17px; }
  #job-card li.waiting { color: var(--ink-soft); font-size: 16px; font-weight: 500; }
  #job-card li.waiting::before { content: "・"; color: var(--ink-soft); }
  #job-card li.done-count { color: var(--done); font-size: 15px; font-weight: 500; }
  #job-card li.done-count::before { content: "✓"; color: var(--done); font-weight: 800; }

  .bar { height: 10px; margin-top: 6px; border-radius: 999px; background: rgba(0,0,0,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent);
           background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 8px, transparent 8px 16px);
           transition: width .8s cubic-bezier(.2,.9,.3,1.2); }
  .bar-label { float: right; font-size: 13px; color: var(--ink-soft); margin-top: -1px; }

  /* 小目標: 吹き出し */
  .bubble {
    position: relative; background: #fff; border-radius: 24px; padding: 14px 20px 14px;
    border: 3px solid var(--accent); box-shadow: 0 10px 26px rgba(40, 20, 50, .28);
  }
  .bubble::before {
    content: ""; position: absolute; top: -16px; left: 44px; border: 10px solid transparent;
    border-bottom: 14px solid var(--accent);
  }
  .bubble::after {
    content: ""; position: absolute; top: -9px; left: 47px; border: 7px solid transparent;
    border-bottom: 10px solid #fff;
  }
  .now-head { display: flex; align-items: center; gap: 8px; }
  .now-label { font-size: 14px; font-weight: 800; color: #fff; background: var(--accent); padding: 2px 10px; border-radius: 999px; }
  .badge { font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: #ffe7c2; color: #a3620a; }
  .new { font-size: 13px; font-weight: 800; color: var(--accent-deep); opacity: 0; }
  .new.show { animation: newtag 2.4s ease-out forwards; }
  .now-text { font-size: 27px; font-weight: 800; margin-top: 6px; line-height: 1.3; }
  .intent { font-size: 17px; font-weight: 700; color: var(--accent-deep); margin-top: 4px; }
  .intent::before { content: "💭 "; }
  .why { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
  /* LLM が次の目標を考えている間（数十秒から数分、行動も声もない） */
  .thinking {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 14px;
    background: var(--accent-soft); border-radius: 999px; font-size: 18px; font-weight: 800; color: var(--accent-deep);
  }
  .thinking .dots i {
    display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; background: var(--accent-deep);
    animation: think 1.2s ease-in-out infinite;
  }
  .thinking .dots i:nth-child(2) { animation-delay: .2s; }
  .thinking .dots i:nth-child(3) { animation-delay: .4s; }
  .pop { animation: pop .55s cubic-bezier(.2,1.6,.4,1); }

  /* 大目標クリアなどのお知らせ */
  #toast {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    background: #fff; border: 4px solid var(--accent); border-radius: 26px; padding: 18px 34px;
    font-size: 34px; font-weight: 800; color: var(--ink); text-align: center; white-space: nowrap;
    box-shadow: 0 8px 0 var(--accent-soft), 0 16px 40px rgba(40, 20, 50, .35); pointer-events: none;
  }
  #toast small { display: block; font-size: 20px; color: var(--ink-soft); margin-top: 4px; }
  #toast.show { animation: toast 4s ease-in-out forwards; }
  .spark { position: absolute; font-size: 26px; color: var(--accent); opacity: 0; pointer-events: none; }
  .spark.go { animation: spark 1.4s ease-out forwards; }

  .hidden { display: none !important; }

  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) rotate(8deg) } }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }
  @keyframes think { 0%, 80%, 100% { transform: translateY(0); opacity: .35 } 40% { transform: translateY(-6px); opacity: 1 } }
  @keyframes pop { 0% { transform: scale(.92) } 60% { transform: scale(1.04) } 100% { transform: scale(1) } }
  @keyframes newtag { 0% { opacity: 0; transform: translateY(4px) } 15% { opacity: 1; transform: none } 80% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.6) }
    12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06) }
    20%, 82% { opacity: 1; transform: translate(-50%, -50%) scale(1) }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(.96) }
  }
  @keyframes spark { 0% { opacity: 1; transform: translate(0, 0) scale(.6) } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(90deg) } }
</style>
</head>
<body>
<div id="stage" class="hidden">
  <section class="card" id="mission-card">
    <div class="ribbon"><span class="icon">🏰</span>最終目標</div>
    <div class="mission-text" id="mission"></div>
    <div class="town hidden" id="town"></div>
  </section>
  <section class="card" id="objective-card">
    <div class="ribbon"><span class="icon">🌸</span>大目標</div>
    <ol id="objective"></ol>
  </section>
  <section class="card hidden" id="job-card">
    <div class="ribbon"><span class="icon">🌼</span>中目標</div>
    <ol id="job"></ol>
  </section>
  <section class="bubble" id="now">
    <div class="now-head">
      <span class="now-label">小目標</span>
      <span class="badge hidden" id="survival">身を守るため</span>
      <span class="new" id="new">NEW!</span>
    </div>
    <div class="thinking hidden" id="thinking"><span id="thinking-text"></span><span class="dots"><i></i><i></i><i></i></span></div>
    <div class="now-text" id="now-text"></div>
    <div class="intent hidden" id="intent"></div>
    <div class="bar hidden" id="now-bar"><i></i></div>
    <div class="why hidden" id="why"></div>
  </section>
</div>
<div id="toast"></div>
<script>
  const params = new URLSearchParams(location.search)
  const stage = document.getElementById('stage')
  const compact = params.get('compact') === '1'
  stage.classList.toggle('pos-right', params.get('pos') === 'right')
  if (['mint', 'sky', 'lemon'].includes(params.get('theme'))) document.body.classList.add(`theme-${params.get('theme')}`)
  if (params.get('scale')) document.documentElement.style.setProperty('--scale', Number(params.get('scale')) || 1)

  const $ = (id) => document.getElementById(id)
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text !== undefined) e.textContent = text
    return e
  }

  // 進み具合の行（例: "have 12 planks (5/12): ..."）の分数を足し合わせる。なければ null
  function fraction (lines, firstOnly) {
    let got = 0; let need = 0
    for (const line of (firstOnly ? lines.slice(0, 1) : lines)) {
      const m = /\((\d+)\/(\d+)\)/.exec(line)
      if (m) { got += Math.min(Number(m[1]), Number(m[2])); need += Number(m[2]) }
    }
    return need ? { got, need } : null
  }
  function bar (node, f) {
    node.classList.toggle('hidden', !f)
    if (!f) return
    node.firstElementChild.style.width = `${Math.round(100 * f.got / f.need)}%`
  }
  function restart (node, cls) {
    node.classList.remove(cls)
    void node.offsetWidth // アニメーションをもう一度始める
    node.classList.add(cls)
  }

  function townLine (data) {
    const name = data.site ? `「${data.site.name}」` : ''
    if (data.town) {
      const i = data.town.stages.findIndex((s) => s.state === 'current')
      if (data.town.complete) return [`🏘 街${name}`, 'かんせい！', '']
      return [`🏘 街${name}`, `段階 ${i + 1}/${data.town.stages.length}`, data.town.stages[i].title]
    }
    if (data.site) return [`🏘 街${name}`, '場所を決めた', '']
    if (data.survey) return ['🔎 街の場所さがし', `${data.survey.sites.length}/${data.survey.planned}`, '']
    return null
  }

  // 今の大目標の中目標: 済んだ数、今の中目標、待っている中目標（多いときは先の 3 つまで）
  function renderJobs (jobs) {
    const ol = $('job')
    ol.replaceChildren()
    const finished = (s) => s.state === 'done' || s.state === 'met'
    const done = jobs.filter(finished).length
    if (done) ol.append(el('li', 'done-count', `済み ${done} / ${jobs.length}`))
    for (const s of jobs.filter((x) => !finished(x)).slice(0, 3)) {
      const li = el('li', s.state, s.label)
      if (s.requested_by) li.append(el('span', 'req', `💌 ${s.requested_by}さん`))
      else if (s.suggested_by) li.append(el('span', 'req', `💡 ${s.suggested_by}さん`))
      ol.append(li)
    }
    $('job-card').classList.toggle('hidden', compact || !ol.children.length)
  }

  function renderObjectives (list) {
    const ol = $('objective')
    ol.replaceChildren()
    const current = list.filter((g) => g.state === 'current')
    const pending = list.filter((g) => g.state === 'pending').slice(0, compact ? 0 : 2)
    const done = compact ? [] : list.filter((g) => g.state === 'done').slice(-1)
    for (const g of [...current, ...pending, ...done]) {
      const li = el('li', g.state, g.title)
      if (g.requested_by) li.append(el('span', 'req', `💌 ${g.requested_by}さんのおねがい`))
      else if (g.suggested_by) li.append(el('span', 'req', `💡 ${g.suggested_by}さんの提案`))
      if (g.state === 'current') {
        // 条件の数（ブロック 30/70 など）があればそれ、なければ済んだ中目標 / 中目標の数
        let f = fraction(g.progress, false)
        if (!f && g.jobs && g.jobs.length) f = { got: g.jobs_done, need: g.jobs_total }
        if (f) {
          const b = el('div', 'bar'); b.append(el('i'))
          li.append(el('span', 'bar-label', `${f.got}/${f.need}`), b)
          bar(b, f)
        }
        if (g.summary.length && !compact) li.append(el('div', 'sub', g.summary.join(' / ')))
      }
      ol.append(li)
    }
    $('objective-card').classList.toggle('hidden', !ol.children.length)
    renderJobs(current.length ? (current[0].jobs || []) : [])
  }

  let last = null
  function render (data) {
    stage.classList.toggle('hidden', !data.playing)
    if (!data.playing) { last = data; return }
    $('mission').textContent = data.mission ?? ''
    const town = townLine(data)
    $('town').classList.toggle('hidden', !town)
    if (town) {
      $('town').replaceChildren(el('span', null, town[0]), el('span', 'step', town[1]), el('span', null, town[2]))
    }
    renderObjectives(data.objectives)

    const goal = data.goal
    $('thinking').classList.toggle('hidden', !data.thinking)
    if (data.thinking) $('thinking-text').textContent = data.thinking.after_failure ? '🤔 うまくいかなかったから考え直し中' : '🤔 つぎにやることを考え中'
    $('now-text').textContent = goal ? goal.label : (data.thinking ? '' : 'つぎにやることを考え中…')
    $('survival').classList.toggle('hidden', !(goal && goal.survival))
    $('intent').classList.toggle('hidden', !data.intent)
    $('intent').textContent = data.intent ?? ''
    $('why').classList.toggle('hidden', compact || !goal || !goal.reason)
    $('why').textContent = goal && goal.reason ? `なぜ: ${goal.reason}` : ''
    bar($('now-bar'), goal ? fraction(goal.progress, true) : null)

    if (last && last.playing) announce(last, data)
    last = data
  }

  // 前の状態と比べて、目標が変わった・大目標が終わった・頼みを受けた・技を覚えたことを知らせる
  function announce (before, after) {
    const learned = after.skill_learned
    if (learned && learned.seq !== (before.skill_learned && before.skill_learned.seq)) {
      toast('技を覚えた！', `「${learned.description || learned.name}」`, true)
    }
    if ((before.goal && before.goal.goal) !== (after.goal && after.goal.goal)) {
      restart($('now'), 'pop'); restart($('new'), 'show')
    }
    const was = Object.fromEntries(before.objectives.map((g) => [g.id, g.state]))
    for (const g of after.objectives) {
      if (g.state === 'done' && was[g.id] && was[g.id] !== 'done') return toast('大目標クリア！', g.title, true)
      if (!was[g.id] && g.requested_by) return toast(`💌 ${g.requested_by}さんのおねがい`, `「${g.title}」を受けたよ`, false)
      if (!was[g.id] && g.suggested_by) return toast(`💡 ${g.suggested_by}さんの提案`, `「${g.title}」をやるよ`, false)
    }
    if (after.town && after.town.complete && !(before.town && before.town.complete)) toast('街がかんせい！', after.site ? after.site.name : '', true)
  }
  // 同時に起きたお知らせ（技を覚えた瞬間に大目標が終わる、など）は上書きせず、順に出す
  const toasts = []
  let toasting = false
  function toast (title, sub, sparkle) {
    if (params.get('toast') === '0') return
    toasts.push([title, sub, sparkle])
    if (!toasting) nextToast()
  }
  function nextToast () {
    const next = toasts.shift()
    toasting = !!next
    if (!next) return
    const [title, sub, sparkle] = next
    setTimeout(nextToast, 4200)
    const t = $('toast')
    t.replaceChildren(document.createTextNode(title), el('small', null, sub))
    restart(t, 'show')
    if (!sparkle) return
    for (let i = 0; i < 14; i++) {
      const s = el('span', 'spark', i % 2 ? '✦' : '★')
      const a = (i / 14) * Math.PI * 2
      s.style.left = '50%'; s.style.top = '40%'
      s.style.setProperty('--dx', `${Math.cos(a) * 260}px`); s.style.setProperty('--dy', `${Math.sin(a) * 160}px`)
      document.body.append(s); restart(s, 'go')
      setTimeout(() => s.remove(), 1500)
    }
  }

  if (params.get('demo') === '1') {
    demo()
  } else {
    // 切れても EventSource がつなぎ直す。最初のメッセージは今の目標
    const source = new EventSource('/api/goals/stream')
    source.onmessage = (e) => render(JSON.parse(e.data))
  }

  // 見本: サーバーなしで、目標が変わる・大目標が終わる・頼みを受ける様子を順に出す
  function demo () {
    const objective = (id, title, state, extra = {}) => ({ id, title, state, requested_by: null, stage: null, prepares_town: false, conditions: [], progress: [], summary: [], ended_because: null, ...extra })
    const base = {
      playing: true,
      mission: '生き延びながら家を建て、街にしていく',
      town: { text: '', complete: false, stages: [{ title: '安全地帯と装備', state: 'done' }, { title: '備蓄庫をつくる', state: 'current' }, { title: '街を広げる', state: 'later' }, { title: '住む人のための家', state: 'later' }] },
      site: { name: 'サンライズウッド' },
      survey: null
    }
    const frames = [
      { ...base,
        objectives: [objective('m3', '食べ物をチェストにためる', 'current', { progress: ['stored 16 food (5/16)'], summary: ['焼いた肉 5/16'], jobs: [{ label: '牛を 4 頭狩る', state: 'done' }, { label: '焼いた肉を 16 個そろえる', state: 'current' }, { label: 'チェストに食べ物を 16 個ためる', state: 'waiting' }] }), objective('m4', '松明で家のまわりを明るくする', 'pending'), objective('m2', 'ベッドで寝られるようにする', 'done')],
        goal: { goal: 'have(cooked_beef, 4)', label: 'ステーキを 4 個そろえる', reason: '備蓄の食べ物が足りないから', survival: false, progress: ['have 4 cooked_beef (1/4)'] },
        intent: '近くの牛を見つけて狩りにいく' },
      { ...base,
        objectives: [objective('m3', '食べ物をチェストにためる', 'current', { progress: ['stored 16 food (12/16)'], summary: ['焼いた肉 12/16'], jobs: [{ label: '牛を 4 頭狩る', state: 'done' }, { label: '焼いた肉を 16 個そろえる', state: 'done' }, { label: 'チェストに食べ物を 16 個ためる', state: 'current' }] }), objective('m4', '松明で家のまわりを明るくする', 'pending'), objective('m5', '羊毛のじゅうたん', 'pending', { requested_by: 'neko' }), objective('m2', 'ベッドで寝られるようにする', 'done')],
        goal: { goal: 'stored(food, 16)', label: 'チェストに食べ物を 16 個ためる', reason: '夜にお腹がすかないように', survival: false, progress: ['stored 16 food (12/16)'] },
        intent: '焼いたお肉をチェストに入れる',
        thinking: { after_failure: false } },
      { ...base,
