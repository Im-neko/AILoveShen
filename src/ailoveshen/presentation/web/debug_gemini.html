<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini の思考</title>
<!--
  デバッグ用: /api/debug/gemini を 2 秒ごとに読んで、Gemini の直近の呼び出しを新しい順に出す。
  ブラウザでも、OBS のブラウザソースでも開ける。クエリ: ?limit=5（件数、既定 5）、?prompt=1（プロンプトも開いて出す）
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px; background: #111418; color: #e6e6e6;
         font: 14px/1.5 "Noto Sans JP", "Hiragino Sans", sans-serif; }
  .call { border: 1px solid #2c333b; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #181c21; }
  .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 12px; color: #9aa4ae; }
  .purpose { font-weight: 700; font-size: 14px; color: #fff; }
  .level { padding: 0 6px; border-radius: 4px; background: #2c333b; }
  .level.high { background: #6b3b8f; } .level.medium { background: #2f5d8a; }
  .error { color: #ff8a80; }
  h4 { margin: 8px 0 2px; font-size: 12px; color: #9aa4ae; font-weight: 600; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.45 ui-monospace, "SFMono-Regular", monospace; }
  .thoughts { color: #d7c9ff; }
  .tool { color: #a5e6b0; }
  details summary { cursor: pointer; font-size: 12px; color: #9aa4ae; }
  #status { font-size: 12px; color: #9aa4ae; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="status">読み込み中…</div>
<div id="calls"></div>
<script>
  const params = new URLSearchParams(location.search)
  const limit = Number(params.get('limit') || 5)
  const openPrompt = params.get('prompt') === '1'
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text !== undefined) e.textContent = text
    return e
  }
  const section = (title, text, cls) => {
    const box = el('div')
    box.append(el('h4', null, title), el('pre', cls, text))
    return box
  }
  function render (calls) {
    const root = document.getElementById('calls')
    root.replaceChildren()
    for (const c of calls) {
      const box = el('div', 'call')
      const head = el('div', 'head')
      head.append(el('span', 'purpose', c.purpose), el('span', 'level ' + (c.thinking_level || ''), c.thinking_level || '-'),
        el('span', null, new Date(c.at).toLocaleTimeString()), el('span', null, `${c.elapsed_ms}ms`))
      if (c.tokens) head.append(el('span', null, `prompt ${c.tokens.prompt ?? '-'} / thoughts ${c.tokens.thoughts ?? '-'} / output ${c.tokens.output ?? '-'}`))
      if (c.finish_reason) head.append(el('span', null, c.finish_reason))
      box.append(head)
      if (c.error) box.append(section('エラー', c.error, 'error'))
      if (c.thoughts) box.append(section('思考（要約）', c.thoughts, 'thoughts'))
      for (const t of c.tool_calls || []) box.append(section('道具', `${t.name} ${JSON.stringify(t.args, null, 1)}`, 'tool'))
      if (c.output) {
        let out = c.output
        try { out = JSON.stringify(JSON.parse(out), null, 1) } catch (e) {}
        box.append(section('出力', out))
      }
      const prompt = el('details')
      prompt.open = openPrompt
      prompt.append(el('summary', null, 'プロンプト'), el('pre', null, c.prompt))
      box.append(prompt)
      root.append(box)
    }
  }
  let last = null
  async function poll () {
    try {
      const r = await fetch(`/api/debug/gemini?limit=${limit}`, { cache: 'no-store' })
      const calls = await r.json()
      const top = calls[0]?.id ?? null
      if (top !== last) { render(calls); last = top }
      document.getElementById('status').textContent = `更新 ${new Date().toLocaleTimeString()}（直近 ${calls.length} 件）`
    } catch (e) {
      document.getElementById('status').textContent = `読めない: ${e}`
    }
  }
  poll()
  setInterval(poll, 2000)
</script>
</body>
</html>
